function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

function wlVal(r,key){ const e=state.edits[r.id]||{};
  switch(key){
    case 'risk': return r.risk||''; case 'name': return r.name||'';
    case 'dsl': return r.dsl==null?1e9:r.dsl;
    case 'owner': return e.owner||''; case 'status': return e.status||'미착수';
    case 'call_result': return e.call_result||''; case 'conversion': return e.conversion||'';
    case 'reengaged': return e.reengaged||''; case 'memo': return e.memo||'';
    case 'updated_at': return e.updated_at||''; default: return '';
  } }
function wlFiltered(){ const D=DATA, s=state, q=(s.q||'').trim();
  const fr=Object.keys(s.fRisk).filter(k=>s.fRisk[k]);
  const fs=Object.keys(s.fStatus).filter(k=>s.fStatus[k]);
  return D.watchlist.filter(r=>{ const e=s.edits[r.id]||{};
    if(fr.length && fr.indexOf(r.risk)<0) return false;
    if(fs.length && fs.indexOf(e.status||'미착수')<0) return false;
    if(q && !((r.name||'').indexOf(q)>=0 || (r.prov||'').indexOf(q)>=0 || (e.owner||'').indexOf(q)>=0)) return false;
    return true; }); }
function wlSorted(rows){ const s=state; if(!s.sortKey) return rows;
  return rows.slice().sort((a,b)=>{ let x=wlVal(a,s.sortKey), y=wlVal(b,s.sortKey), c;
    if(typeof x==='number'&&typeof y==='number') c=x-y;
    else{ x=String(x); y=String(y); if(x===''&&y!=='') return 1; if(y===''&&x!=='') return -1; c=x.localeCompare(y,'ko'); }
    return c*(s.sortAsc?1:-1); }); }
function currentPageRows(){ const s=state, sorted=wlSorted(wlFiltered());
  const total=sorted.length, pages=s.size===0?1:Math.max(1,Math.ceil(total/s.size));
  const page=Math.min(Math.max(1,s.page),pages);
  return s.size===0? sorted : sorted.slice((page-1)*s.size,(page-1)*s.size+s.size); }
function patch(ids, field, value){ const e=Object.assign({},state.edits), d=Object.assign({},state.dirty);
  ids.forEach(id=>{ e[id]=Object.assign({},e[id]); e[id][field]=value; d[id]=true; });

function parseCSV(text){ text=text.replace(/^﻿/,''); const rows=[]; let f='',row=[],q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f='';}
      else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
      else if(c==='\r'){} else f+=c; } }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.length>1||r[0]!==''); }

        <button type="button" data-a="onToggleTM" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:700">${V.tmBtn}</button>
        <span style="flex:1"></span>
        <button type="button" data-a="onImportClick" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:700">CSV 불러오기</button>
        <input type="file" id="wlFile" accept=".csv,text/csv" data-c="onFile" style="display:none" />
        <button type="button" data-a="onExport" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:700">CSV 내보내기</button>
        <button type="button" data-a="onResetEdits" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#96483E;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:700">편집 초기화</button>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
        <span style="font-size:13.5px;font-weight:700;color:#A0A7B8;margin-right:4px">위험도</span>
        ${V.riskChips.map(c=>`<button type="button" data-a="onChip" data-grp="risk" data-val="${c.val}" style="cursor:pointer;border:2px solid ${c.bd};background:${c.bg};color:${c.ink};border-radius:20px;padding:6px 14px;font-size:14px;font-weight:700">${c.label}</button>`).join('')}
        <span style="font-size:13.5px;font-weight:700;color:#A0A7B8;margin:0 4px 0 12px">진행상태</span>
        ${V.statusChips.map(c=>`<button type="button" data-a="onChip" data-grp="status" data-val="${c.val}" style="cursor:pointer;border:2px solid ${c.bd};background:${c.bg};color:${c.ink};border-radius:20px;padding:6px 14px;font-size:14px;font-weight:700">${c.label}</button>`).join('')}
        ${V.anyFilter?`<button type="button" data-a="onClearFilter" style="cursor:pointer;border:2px dashed #C0392B;background:#fff;color:#C0392B;border-radius:20px;padding:6px 14px;font-size:14px;font-weight:700">필터 초기화</button>`:''}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#ECEFF5;border-radius:12px;padding:12px 16px;margin-bottom:12px">
        <b style="font-size:15px;font-variant-numeric:tabular-nums">선택 ${V.selCount}명</b><span style="font-size:14px;color:#8A92A6">선택한 사람에게 일괄 적용</span>
        <select data-c="onBulkStatusSel" style="font-size:14.5px;padding:7px 10px;border:2px solid #DDE1EA;border-radius:8px;background:#fff;color:#0F1B3D">${optionsOf(bs,V.bulkStatus)}</select>
        <button type="button" data-a="onBulkStatus" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 13px;font-size:14px;font-weight:700">상태 적용</button>
        <input type="text" data-c="onBulkOwnerInput" value="${esc(V.bulkOwner)}" placeholder="담당자 일괄" style="width:130px;font-size:14.5px;padding:7px 10px;border:2px solid #DDE1EA;border-radius:8px;background:#fff;color:#0F1B3D" />
        <button type="button" data-a="onBulkOwner" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 13px;font-size:14px;font-weight:700">담당 배정</button>
        <input type="text" data-c="onBulkMemoInput" value="${esc(V.bulkMemo)}" placeholder="메모 일괄" style="width:150px;font-size:14.5px;padding:7px 10px;border:2px solid #DDE1EA;border-radius:8px;background:#fff;color:#0F1B3D" />
        <button type="button" data-a="onBulkMemo" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 13px;font-size:14px;font-weight:700">메모 적용</button>
        <span style="flex:1"></span><button type="button" data-a="onSelClear" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#8A92A6;border-radius:8px;padding:7px 13px;font-size:14px;font-weight:700">선택 해제</button>
      </div>
      <div id="saveBar" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:${V.saveBarBg};border:2px solid ${V.saveBarBd};border-radius:12px;padding:12px 16px;margin-bottom:14px"><button type="button" data-a="onSave" id="saveBtn" style="cursor:pointer;border:2px solid ${V.saveBtnBd};background:${V.saveBtnBg};color:${V.saveBtnInk};border-radius:9px;padding:9px 20px;font-size:15px;font-weight:800">저장</button><span id="saveStat" style="font-size:14.5px;font-weight:700;color:${V.saveStatInk}">${V.saveStat}</span><span style="flex:1"></span><span style="font-size:14px;color:#8A92A6">편집 내용은 이 브라우저에 저장됩니다. 팀 공유는 CSV 내보내기를 쓰세요.</span></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:14.5px;color:#5B6478"><span style="font-weight:700;color:#A0A7B8">표시</span>${V.sizeBtns.map(s=>`<button type="button" data-a="onPageSize" data-size="${s.val}" style="cursor:pointer;border:2px solid ${s.bd};background:${s.bg};color:${s.ink};border-radius:8px;padding:5px 12px;font-size:14px;font-weight:700">${s.label}</button>`).join('')}<span style="margin-left:8px;font-variant-numeric:tabular-nums">총 <b>${V.total}</b>건</span>${V.multiPage?`<span style="display:inline-flex;gap:10px;align-items:center;margin-left:4px"><button type="button" data-a="onPage" data-pg="prev" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:5px 12px;font-size:14px;font-weight:700">이전</button><b style="font-variant-numeric:tabular-nums">${V.page} / ${V.pages}</b><button type="button" data-a="onPage" data-pg="next" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:5px 12px;font-size:14px;font-weight:700">다음</button></span>`:''}</div>
      <div style="border:2px solid #E4E8F2;border-radius:14px;overflow:hidden"><div style="max-height:620px;overflow:auto"><table style="width:100%;font-size:15px"><thead><tr>
        <th style="position:sticky;top:0;z-index:2;background:#0F1B3D;padding:12px 10px;width:42px;text-align:center"><input type="checkbox" data-c="onAll"${V.allChecked?' checked':''} style="width:17px;height:17px;cursor:pointer" /></th>
        ${V.wlCols.map(c=>`<th data-a="onSort" data-k="${c.k}" style="position:sticky;top:0;z-index:2;background:#0F1B3D;color:${c.ink};text-align:${c.align};padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;border-left:${c.bl}">${c.label}${c.ar}</th>`).join('')}
      </tr></thead><tbody>${V.wlRows.map(r=>`<tr data-id="${r.id}" style="background:${r.bg}">
        <td style="padding:11px 10px;border-bottom:1px solid #EFF1F5;text-align:center"><input type="checkbox" data-c="onRowChk" data-id="${r.id}"${r.selected?' checked':''} style="width:17px;height:17px;cursor:pointer" /></td>
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5"><span style="display:inline-block;padding:4px 11px;border-radius:7px;font-size:13px;font-weight:800;white-space:nowrap;background:${r.riskColor};color:#fff">${r.risk}</span></td>
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5;white-space:nowrap"><b style="font-weight:700">${esc(r.name)}</b> <span style="color:#A0A7B8;font-size:13.5px">${r.sub}</span></td>
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;color:${r.dslInk}">${r.dsl}</td>
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5"><input type="text" data-c="onEdit" data-id="${r.id}" data-f="owner" value="${esc(r.owner)}" placeholder="담당" style="width:84px;font-size:14.5px;padding:6px 8px;border:2px solid #E4E8F2;border-radius:7px;background:#fff;color:#0F1B3D" /></td>
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5;white-space:nowrap"><select data-c="onEdit" data-id="${r.id}" data-f="status" style="font-size:14.5px;padding:6px 8px;border:2px solid #E4E8F2;border-radius:7px;background:#fff;color:#0F1B3D">${optionsOf(STATUS_ALL,r.status)}</select><span class="dmark" style="color:#D98A0B;font-weight:800;margin-left:5px">${r.dirtyMark}</span></td>
        ${V.showTM?`<td style="padding:11px 14px;border-bottom:1px solid #EFF1F5;border-left:2px solid #E4E8F2"><select data-c="onEdit" data-id="${r.id}" data-f="call_result" style="font-size:14.5px;padding:6px 8px;border:2px solid #E4E8F2;border-radius:7px;background:#fff;color:#0F1B3D">${optionsOf(V.callResults,r.call_result)}</select></td><td style="padding:11px 14px;border-bottom:1px solid #EFF1F5"><select data-c="onEdit" data-id="${r.id}" data-f="conversion" style="font-size:14.5px;padding:6px 8px;border:2px solid #E4E8F2;border-radius:7px;background:#fff;color:#0F1B3D">${optionsOf(V.conversions,r.conversion)}</select></td><td style="padding:11px 14px;border-bottom:1px solid #EFF1F5"><select data-c="onEdit" data-id="${r.id}" data-f="reengaged" style="font-size:14.5px;padding:6px 8px;border:2px solid #E4E8F2;border-radius:7px;background:#fff;color:#0F1B3D">${optionsOf(V.reengaged,r.reengaged)}</select></td>`:''}
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5;border-left:2px solid #E4E8F2"><input type="text" data-c="onEdit" data-id="${r.id}" data-f="memo" value="${esc(r.memo)}" placeholder="통화 결과 기록" style="width:180px;font-size:14.5px;padding:6px 8px;border:2px solid #E4E8F2;border-radius:7px;background:#fff;color:#0F1B3D" /></td>
        <td style="padding:11px 14px;border-bottom:1px solid #EFF1F5;font-size:13.5px;color:#A0A7B8;white-space:nowrap;font-variant-numeric:tabular-nums">${r.updated}</td>
      </tr>`).join('')}</tbody></table></div></div>
      <p style="margin:16px 0 0;font-size:14.5px;line-height:1.6;color:#8A92A6">개인정보 명단입니다. 내보낸 CSV 파일은 내부에서만 취급하세요. 팀원이 편집한 CSV는 «CSV 불러오기»로 다시 반영됩니다(id 기준 병합).</p>
    </div>
    <p style="margin:0;font-size:15.5px;line-height:1.6;color:#5B6478;border-left:3px solid #2F55E6;padding-left:20px">이 명단으로 무엇을 할지는 <b style="color:#0F1B3D">«실행방안»</b> 탭에서 정합니다.</p>
  </div>`;
}

function hTab5(V){
  return `<div style="display:flex;flex-direction:column;gap:26px">
    <div style="display:flex;flex-wrap:wrap;border-radius:20px;overflow:hidden;border:2px solid #E4E8F2">
      <div style="background:#ECEFF5;padding:38px 36px;display:flex;flex-direction:column;position:relative;flex:1 1 340px;min-width:0">${BAR.replace('margin-bottom:16px','margin-bottom:24px')}${KICK('PLAN · 이벤트 실행방안')}<h2 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.32;text-wrap:pretty">초안 3개 중 <span style="color:#1F3BD0">어느 것으로 갈지 정합니다</span></h2><p style="margin:26px 0 0;font-size:17px;line-height:1.6;color:#5B6478">각 카드를 직접 수정·복제·삭제할 수 있습니다. 확정한 안은 <b style="color:#0F1B3D">«채택»</b>으로 표시하세요. 편집 내용은 이 브라우저에 저장됩니다.</p><span style="position:absolute;left:0;bottom:0;width:22px;height:76px;background:#2F55E6"></span></div>
      <div style="background:#fff;padding:34px 36px;flex:3 1 460px;min-width:0"><h3 style="margin:0 0 18px;font-size:21px;font-weight:800">세 방안의 차이</h3><div style="display:flex;flex-direction:column;gap:10px">${V.planCompare.map(p=>`<div style="display:flex;flex-wrap:wrap;gap:14px 16px;align-items:center;padding:14px 18px;border-radius:12px;background:${p.bg}"><b style="font-size:16px;font-weight:800;color:${p.ink};flex:1 1 150px;min-width:0">${p.name}</b><span style="display:flex;flex-direction:column;gap:2px;flex:1 1 150px;min-width:0"><span style="font-size:12.5px;font-weight:700;color:#A0A7B8">강점</span><span style="font-size:14.5px;line-height:1.45;color:#3C4658">${p.pro}</span></span><span style="display:flex;flex-direction:column;gap:2px;flex:1 1 150px;min-width:0"><span style="font-size:12.5px;font-weight:700;color:#A0A7B8">리스크</span><span style="font-size:14.5px;line-height:1.45;color:#3C4658">${p.con}</span></span></div>`).join('')}</div>${NOTE('세 방안 모두 <b style="color:#0F1B3D">보건소 동의</b>가 전제입니다. 거절 시 대안을 각 카드의 «리스크·검토사항»에 적어두세요.').replace('margin:22px','margin:20px')}</div>
    </div>
    <div style="background:#fff;border:2px solid #E4E8F2;border-radius:18px;padding:28px 32px">${BAR}<div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px"><h3 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em">방안 카드</h3><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span style="font-size:14.5px;color:#8A92A6;font-variant-numeric:tabular-nums;white-space:nowrap">${V.planStat}</span><button type="button" data-a="onPlanAdd" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:700">＋ 새 방안</button><button type="button" data-a="onPlanExport" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:700">내보내기(.md)</button><button type="button" data-a="onPlanReset" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#96483E;border-radius:9px;padding:8px 14px;font-size:14px;font-weight:700">기본 3안 초기화</button></div></div>
      <p style="margin:0 0 24px;font-size:16px;color:#5B6478;line-height:1.6">«편집»을 누르면 카드가 전체 폭으로 펼쳐집니다. 저장을 눌러야 확정됩니다.</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:18px">${V.planCards.map(p=>`<div style="background:#fff;border:2px solid ${p.bd};border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:10px;grid-column:${p.span}">${p.viewing?`
        <div style="display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="display:inline-block;padding:4px 12px;border-radius:8px;font-size:13.5px;font-weight:800;background:${p.statusBg};color:${p.statusInk}">${p.status}</span><h4 style="margin:0;font-size:19px;font-weight:800;flex:1;min-width:140px;letter-spacing:-.01em">${esc(p.title)}</h4></div><div style="display:flex;gap:7px;flex-wrap:wrap">${p.canAdopt?`<button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="adopt" style="cursor:pointer;border:2px solid #1F3BD0;background:#1F3BD0;color:#fff;border-radius:8px;padding:5px 12px;font-size:13.5px;font-weight:700">채택</button>`:''}<button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="edit" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:5px 12px;font-size:13.5px;font-weight:700">편집</button><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="dup" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:5px 12px;font-size:13.5px;font-weight:700">복제</button><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="del" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#96483E;border-radius:8px;padding:5px 12px;font-size:13.5px;font-weight:700">삭제</button></div><p style="margin:2px 0 6px;font-size:15px;line-height:1.6;color:#5B6478">${esc(p.summary)}</p>${p.sections.map(s=>`<div style="border-top:1px solid #EFF1F5;padding:11px 0 2px"><div style="font-size:13.5px;font-weight:800;color:#2F55E6;margin-bottom:4px">${esc(s.l)}</div><div style="font-size:15px;line-height:1.65;white-space:pre-wrap;color:#3C4658">${esc(s.b)}</div></div>`).join('')}<div style="margin-top:8px;font-size:13px;color:#A0A7B8;font-variant-numeric:tabular-nums">최종수정 ${p.updated}</div></div>`:''}${p.editing?`
        <div style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><select data-c="onPlanField" data-pid="${p.id}" data-ef="status" style="font-size:14.5px;padding:7px 10px;border:2px solid #DDE1EA;border-radius:8px;background:#fff;color:#0F1B3D">${optionsOf(['검토중','채택','보류'],p.status)}</select><input type="text" data-c="onPlanField" data-pid="${p.id}" data-ef="title" value="${esc(p.title)}" placeholder="방안 제목" style="flex:1;min-width:180px;font-size:17px;font-weight:700;padding:8px 11px;border:2px solid #DDE1EA;border-radius:8px;background:#fff;color:#0F1B3D" /></div><textarea data-c="onPlanField" data-pid="${p.id}" data-ef="summary" placeholder="한 줄 요약" style="width:100%;min-height:56px;font-size:15px;line-height:1.6;padding:9px 11px;border:2px solid #DDE1EA;border-radius:8px;background:#fff;color:#0F1B3D;resize:vertical">${esc(p.summary)}</textarea>${p.sections.map(s=>`<div style="display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid #EFF1F5"><div style="display:flex;gap:8px;align-items:center"><input type="text" data-c="onPlanSection" data-pid="${p.id}" data-si="${s.i}" data-sf="l" value="${esc(s.l)}" placeholder="항목명" style="flex:1;font-size:14.5px;font-weight:700;padding:7px 10px;border:2px solid #DDE1EA;border-radius:7px;background:#fff;color:#0F1B3D" /><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-si="${s.i}" data-act="secdel" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#96483E;border-radius:7px;padding:6px 12px;font-size:14px;font-weight:700">삭제</button></div><textarea data-c="onPlanSection" data-pid="${p.id}" data-si="${s.i}" data-sf="b" placeholder="내용" style="width:100%;min-height:64px;font-size:15px;line-height:1.6;padding:9px 11px;border:2px solid #DDE1EA;border-radius:7px;background:#fff;color:#0F1B3D;resize:vertical">${esc(s.b)}</textarea></div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid #EFF1F5"><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="secadd" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:700">＋ 항목 추가</button><span style="flex:1"></span><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="save" style="cursor:pointer;border:2px solid #1F3BD0;background:#1F3BD0;color:#fff;border-radius:8px;padding:7px 18px;font-size:14px;font-weight:800">저장</button><button type="button" data-a="onPlanAct" data-pid="${p.id}" data-act="cancel" style="cursor:pointer;border:2px solid #DDE1EA;background:#fff;color:#3C4658;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:700">취소</button></div></div>`:''}</div>`).join('')}</div>
    </div>
  </div>`;
}

function render(){
  const V=computeVals();
  let body;
  if(V.tab1) body=hTab1(V); else if(V.tab2) body=hTab2(V); else if(V.tab3) body=hTab3(V); else if(V.tab4) body=hTab4(V); else body=hTab5(V);
  const toast=V.hasToast?`<div style="position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#0F1B3D;color:#fff;padding:13px 24px;border-radius:11px;font-size:15px;font-weight:700;z-index:200;box-shadow:0 8px 28px rgba(15,27,61,.3)">${esc(V.toast)}</div>`:'';
  document.getElementById('app').innerHTML = hHeader(V)+`<main style="max-width:1480px;margin:0 auto;padding:32px 32px 90px">${body}</main>`+toast;
}
// ===END-PART3C===

/* ---------- state loop + handlers ---------- */
function setState(patchObj){ if(typeof patchObj==='function') patchObj=patchObj(state); Object.assign(state, patchObj); render(); }
function syncSave(){
  const dc=Object.keys(state.dirty).filter(k=>state.dirty[k]).length;
  const bar=document.getElementById('saveBar'), btn=document.getElementById('saveBtn'), stat=document.getElementById('saveStat');
  if(!bar||!btn||!stat) return;
  bar.style.background=dc>0?C.amberSoft:C.panel; bar.style.borderColor=dc>0?C.amber:C.panel2;
  btn.style.background=dc>0?C.blue:'#fff'; btn.style.borderColor=dc>0?C.blue:C.line; btn.style.color=dc>0?'#fff':C.sub;
  stat.style.color=dc>0?C.amberInk:C.mut;
  stat.textContent=dc>0?('저장 안 된 변경 '+dc+'건'):(state.lastSaved?('저장됨 · 마지막 '+state.lastSaved):'변경 없음');
}
function selIds(){ return Object.keys(state.sel).filter(k=>state.sel[k]); }
function dirtyIds(){ return Object.keys(state.dirty).filter(k=>state.dirty[k]); }

const ACT = {
  onTab: e => setState({tab:e.currentTarget.dataset.tab}),
  onTerms: () => setState({termsOpen:!state.termsOpen}),
  onGSort: e => { const k=e.currentTarget.dataset.k; if(!k) return;
    setState(st=> st.gSort===k ? {gAsc:!st.gAsc} : {gSort:k, gAsc:(k==='name')}); },
  onChip: e => { const g=e.currentTarget.dataset.grp, v=e.currentTarget.dataset.val, key=g==='risk'?'fRisk':'fStatus';
    const next=Object.assign({},state[key]); next[v]=!next[v]; setState({[key]:next, page:1}); },
  onClearFilter: () => setState({fRisk:{},fStatus:{},page:1}),
  onSearch: e => setState({q:e.target.value, page:1}),
  onToggleTM: () => setState({showTM:!state.showTM}),
  onPageSize: e => setState({size:+e.currentTarget.dataset.size, page:1}),
  onPage: e => setState(st=>({ page: e.currentTarget.dataset.pg==='prev'?Math.max(1,st.page-1):st.page+1 })),
  onSort: e => { const k=e.currentTarget.dataset.k; if(!k) return;
    setState(st=> st.sortKey===k ? {sortAsc:!st.sortAsc} : {sortKey:k, sortAsc:true}); },
  onAll: e => { const on=e.target.checked, sel=Object.assign({},state.sel);
    currentPageRows().forEach(r=>{ if(on) sel[r.id]=true; else delete sel[r.id]; }); setState({sel}); },
  onRowChk: e => { const id=e.target.dataset.id, sel=Object.assign({},state.sel);
    if(e.target.checked) sel[id]=true; else delete sel[id]; setState({sel}); },
  onEdit: e => { const t=e.target; patch([t.dataset.id], t.dataset.f, t.value);
    const row=document.querySelector('tr[data-id="'+t.dataset.id+'"] .dmark'); if(row) row.textContent='●'; syncSave(); },
  onSelClear: () => setState({sel:{}}),
  onBulkStatusSel: e => { state.bulkStatus=e.target.value; },
  onBulkOwnerInput: e => { state.bulkOwner=e.target.value; },
  onBulkMemoInput: e => { state.bulkMemo=e.target.value; },
  onBulkStatus: () => { const v=state.bulkStatus, ids=selIds(); if(!v||!ids.length) return;
    patch(ids,'status',v); toast('진행상태 «'+v+'» '+ids.length+'명 적용 · 저장 필요'); },
  onBulkOwner: () => { const ids=selIds(); if(!ids.length) return; const v=(state.bulkOwner||'').trim();
    patch(ids,'owner',v); toast('담당자 «'+(v||'비움')+'» '+ids.length+'명 적용 · 저장 필요'); },
  onBulkMemo: () => { const ids=selIds(); if(!ids.length) return;
    patch(ids,'memo',state.bulkMemo||''); toast('메모 '+ids.length+'명 적용 · 저장 필요'); },
  onSave: () => { const ids=dirtyIds(); if(!ids.length){ toast('저장할 변경사항이 없습니다'); return; }
    const now=stamp(), e=Object.assign({},state.edits);
    ids.forEach(id=>{ e[id]=Object.assign({},e[id]); e[id].updated_at=now; });
    saveEdits(e); try{ localStorage.setItem(WL_SAVED, now); }catch(x){}
    state.edits=e; state.dirty={}; state.lastSaved=now; render(); toast(ids.length+'건 저장됨 · '+now); },
  onResetEdits: () => { if(!window.confirm('편집한 담당자·진행상태·메모·기록을 모두 지웁니다. 계속할까요?')) return;
    saveEdits({}); try{ localStorage.removeItem(WL_SAVED); }catch(x){}
    state.edits={}; state.dirty={}; state.sel={}; state.lastSaved=''; render(); toast('편집 내용을 초기화했습니다'); },
  onImportClick: () => { const f=document.getElementById('wlFile'); if(f) f.click(); },
  onExport: () => { const HDR=['id','이름','연령','성별','기관','미접속일','위험도','담당자','진행상태','통화결과','핵심전환','1주후재접속','메모','최종수정'];
    const sIds=selIds(), filtered=wlFiltered(), src=sIds.length?filtered.filter(r=>state.sel[r.id]):filtered;
    const lines=[HDR.map(csvCell).join(',')].concat(src.map(r=>{ const e=state.edits[r.id]||{};
      return [r.id,r.name,r.age,r.sex,r.prov,r.dsl,r.risk,e.owner||'',e.status||'미착수',e.call_result||'',e.conversion||'',e.reengaged||'',e.memo||'',e.updated_at||''].map(csvCell).join(','); }));
    download('맬리브레인_대상자관리.csv', lines.join('\r\n'), 'text/csv'); toast(src.length+'건 내보냈습니다'); },
  onFile: e => { const file=e.target.files&&e.target.files[0]; if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const rows=parseCSV(String(rd.result)), head=rows.shift()||[], ci=n=>head.indexOf(n);
      const iId=ci('id'), map={ owner:ci('담당자'), status:ci('진행상태'), call_result:ci('통화결과'), conversion:ci('핵심전환'), reengaged:ci('1주후재접속'), memo:ci('메모'), updated_at:ci('최종수정') };
      if(iId<0){ window.alert('id 열을 찾을 수 없습니다. 내보낸 CSV 형식인지 확인하세요.'); return; }
      const valid={}; DATA.watchlist.forEach(r=>valid[r.id]=1); const e=Object.assign({},state.edits); let ok=0,miss=0;
      rows.forEach(r=>{ const id=(r[iId]||'').trim(); if(!id) return; if(!valid[id]){ miss++; return; }
        const cur=Object.assign({},e[id]); Object.keys(map).forEach(f=>{ const i=map[f]; if(i>=0&&r[i]!=null&&r[i]!=='') cur[f]=r[i].trim(); }); e[id]=cur; ok++; });
      saveEdits(e); state.edits=e; state.dirty={}; render();
      window.alert('불러오기 완료 · '+ok+'건 반영'+(miss?(' / '+miss+'건 미매칭(명단에 없는 id)'):'')); }
      catch(err){ window.alert('CSV를 읽지 못했습니다: '+err.message); }
      const f2=document.getElementById('wlFile'); if(f2) f2.value=''; };
    rd.readAsText(file,'utf-8'); },
  onPlanAdd: () => { const id='p'+Date.now().toString(36);
    const p={ id, status:'검토중', title:'새 방안', summary:'', sections:PLAN_TMPL.map(l=>({l,b:''})), updated_at:'' };
    const plans=state.plans.concat([p]); state.planSaved=savePlans(plans); setState({plans, editingPlan:id}); },
  onPlanReset: () => { if(!window.confirm('편집한 내용을 버리고 기본 3안으로 되돌립니다. 계속할까요?')) return;
    const plans=seedPlans(); state.planSaved=savePlans(plans); setState({plans, editingPlan:null}); toast('기본 3안으로 되돌렸습니다'); },
  onPlanExport: () => { const md=state.plans.map(p=>'# '+p.title+'  ('+p.status+')\n\n'+p.summary+'\n\n'+(p.sections||[]).map(x=>'## '+x.l+'\n'+x.b).join('\n\n')).join('\n\n---\n\n');
    download('맬리_이벤트_실행방안.md', md, 'text/markdown'); },
  onPlanField: e => { const t=e.target, pid=t.dataset.pid, f=t.dataset.ef;
    state.plans=state.plans.map(p=> p.id===pid ? Object.assign({},p,{[f]:t.value}) : p); },
  onPlanSection: e => { const t=e.target, pid=t.dataset.pid, si=+t.dataset.si, f=t.dataset.sf;
    state.plans=state.plans.map(p=>{ if(p.id!==pid) return p;
      const sections=p.sections.map((x,i)=> i===si ? Object.assign({},x,{[f]:t.value}) : x); return Object.assign({},p,{sections}); }); },
  onPlanAct: e => { const b=e.currentTarget, pid=b.dataset.pid, act=b.dataset.act;
    let plans=state.plans.slice(); const idx=plans.findIndex(p=>p.id===pid); if(idx<0) return; const p=plans[idx];
    if(act==='edit'){ setState({editingPlan:pid}); return; }
    if(act==='cancel'){ let restored=plans; try{ const v=JSON.parse(localStorage.getItem(PLAN_KEY)); if(Array.isArray(v)&&v.length) restored=v; }catch(x){}
      setState({plans:restored, editingPlan:null}); return; }
    if(act==='save'){ plans[idx]=Object.assign({},p,{updated_at:stamp()}); state.planSaved=savePlans(plans); setState({plans, editingPlan:null}); toast('방안을 저장했습니다'); return; }
    if(act==='adopt'){ plans[idx]=Object.assign({},p,{status:'채택',updated_at:stamp()}); state.planSaved=savePlans(plans); setState({plans}); toast('«'+p.title+'» 채택'); return; }
    if(act==='dup'){ const c=JSON.parse(JSON.stringify(p)); c.id='p'+Date.now().toString(36); c.title=p.title+' (복제)'; c.status='검토중'; c.updated_at=stamp();
      plans.splice(idx+1,0,c); state.planSaved=savePlans(plans); setState({plans}); toast('복제했습니다'); return; }
    if(act==='del'){ if(!window.confirm('«'+p.title+'» 방안을 삭제할까요?')) return; plans.splice(idx,1); state.planSaved=savePlans(plans);
      setState({plans, editingPlan: state.editingPlan===pid?null:state.editingPlan}); toast('삭제했습니다'); return; }
    if(act==='secadd'){ plans[idx]=Object.assign({},p,{sections:(p.sections||[]).concat([{l:'',b:''}])}); setState({plans}); return; }
    if(act==='secdel'){ const si=+b.dataset.si; plans[idx]=Object.assign({},p,{sections:p.sections.filter((_,i)=>i!==si)}); setState({plans}); return; }
  }
};

document.addEventListener('click', ev=>{ const el=ev.target.closest('[data-a]'); if(!el) return;
  const fn=ACT[el.dataset.a]; if(fn) fn({currentTarget:el, target:ev.target}); });
document.addEventListener('change', ev=>{ const el=ev.target.closest('[data-c]'); if(!el) return;
  const fn=ACT[el.dataset.c]; if(fn) fn({currentTarget:el, target:ev.target}); });

render();
</script>
