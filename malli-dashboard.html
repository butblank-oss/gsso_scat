<style>
:root{
  --bg:#F4F5F3; --surface:#FFFFFF; --surface-2:#FAFAF8; --ink:#1B2430; --sub:#6B7280; --muted:#9AA1AC;
  --line:#E7E4DC; --line-2:#EFEDE6;
  --brand:#146B6B; --brand-soft:#DCEBE9;
  --good:#1B9E70; --good-soft:#DEF0E8;
  --warn:#C48A1F; --warn-soft:#F6EAD1;
  --bad:#B8453B; --bad-soft:#F5E1DE;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#4a3aa7;
  --shadow:0 1px 2px rgba(20,30,45,.04),0 2px 8px rgba(20,30,45,.04);
  --radius:12px;
}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1D2125; --surface-2:#22272B; --ink:#EDEEEC; --sub:#9AA3AD; --muted:#6B7580;
  --line:#2E353B; --line-2:#272D32;
  --brand:#4FB3AD; --brand-soft:#123734;
  --good:#3FC08C; --good-soft:#12332A; --warn:#E0A93A; --warn-soft:#33280F; --bad:#E07065; --bad-soft:#331C1A;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
.mono{font-family:'Roboto Mono','SF Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
a{color:var(--brand);}

/* ===== Top bar ===== */
header{ position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--line); }
.top{ max-width:1280px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
.brand-mark{ font-weight:800; font-size:16px; letter-spacing:-.01em; display:flex; align-items:center; gap:8px;}
.brand-mark .dot{ width:26px;height:26px;border-radius:8px;background:var(--brand); color:#fff; display:grid; place-items:center; font-size:15px;}
.top .spacer{flex:1;}
.chip{ font-size:11.5px; padding:4px 10px; border-radius:20px; background:var(--surface-2); border:1px solid var(--line); color:var(--sub);}
.chip b{color:var(--ink);}
.iconbtn{ cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:8px; padding:6px 12px; font-size:12.5px; font-weight:600; display:inline-flex; gap:6px; align-items:center;}
.iconbtn:hover{border-color:var(--brand); color:var(--brand);}

/* ===== Tabs ===== */
nav.tabs{ max-width:1280px; margin:0 auto; padding:0 12px; display:flex; gap:2px; overflow-x:auto; }
nav.tabs button{ border:0; background:transparent; color:var(--sub); font-family:inherit; font-size:13px; font-weight:600; padding:12px 16px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;}
nav.tabs button:hover{color:var(--ink);}
nav.tabs button.active{ color:var(--brand); border-bottom-color:var(--brand);}

/* ===== Layout ===== */
main{ max-width:1280px; margin:0 auto; padding:22px; }
.view{display:none;}
.view.active{display:block; animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.sec-title{ font-size:12px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:.06em; margin:26px 0 12px; display:flex; align-items:center; gap:8px;}
.sec-title:first-child{margin-top:4px;}
.note{ font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.55;}
.banner{ background:var(--warn-soft); border:1px solid var(--warn); border-radius:10px; padding:11px 16px; font-size:12px; color:var(--ink); margin-bottom:20px; display:flex; gap:10px; align-items:flex-start;}
.banner .i{font-size:15px;}

/* ===== Cards & grid ===== */
.grid{display:grid; gap:14px;}
.g5{grid-template-columns:repeat(5,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
.g21{grid-template-columns:1.4fr 1fr;} .g12{grid-template-columns:1fr 1.4fr;}
@media(max-width:1000px){ .g5,.g4,.g3,.g21,.g12{grid-template-columns:repeat(2,1fr);} }
@media(max-width:620px){ .g5,.g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr;} }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
.card h3{ margin:0 0 3px; font-size:13.5px; font-weight:700;}
.card .csub{ font-size:11.5px; color:var(--sub); margin-bottom:12px;}

/* KPI */
.kpi .l{font-size:11.5px; color:var(--sub); font-weight:600;}
.kpi .v{font-size:27px; font-weight:800; margin-top:5px; letter-spacing:-.02em;}
.kpi .d{font-size:11.5px; margin-top:4px; color:var(--sub); font-weight:600;}
.kpi .d.up{color:var(--good);} .kpi .d.down{color:var(--bad);}
.kpi .bar{height:5px;border-radius:3px;background:var(--line-2);margin-top:10px;overflow:hidden;}
.kpi .bar>span{display:block;height:100%;background:var(--brand);border-radius:3px;}

/* ===== Tables ===== */
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{padding:9px 8px; text-align:left; border-bottom:1px solid var(--line-2);}
thead th{ color:var(--sub); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; background:var(--surface); cursor:pointer; user-select:none;}
th.r,td.r{text-align:right;}
tbody tr:hover{background:var(--surface-2);}
.tw{max-height:560px; overflow:auto; border:1px solid var(--line); border-radius:10px;}

/* pills / badges */
.pill{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700; white-space:nowrap;}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.pill.brand{background:var(--brand-soft); color:var(--brand);}
.pill.neut{background:var(--line-2); color:var(--sub);}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; font-size:11.5px; color:var(--sub);}
.legend span{display:inline-flex; align-items:center; gap:6px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* svg chart */
.chart{width:100%;}
.chart text{fill:var(--sub); font-size:11px; font-family:inherit;}
.chart .val{fill:var(--ink); font-weight:700; font-family:'Roboto Mono',monospace;}
.axis{stroke:var(--line-2); stroke-width:1;}
.barseg:hover{opacity:.82;}

/* form controls */
select,input[type=text],input[type=search]{ font-family:inherit; font-size:12.5px; padding:6px 9px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink);}
select:focus,input:focus{outline:2px solid var(--brand-soft); border-color:var(--brand);}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;}
.chips .grp{font-size:11px;color:var(--sub);font-weight:700;margin:0 2px 0 6px;}
.chips .grp:first-child{margin-left:0;}
.fchip{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:20px;padding:3px 11px;font-size:12px;font-weight:600;font-family:inherit;transition:all .12s;}
.fchip:hover{border-color:var(--brand);color:var(--brand);}
.fchip.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.fchip.clear{color:var(--bad);border-style:dashed;}
th.grph{text-align:center;background:var(--surface-2);color:var(--brand);font-size:10.5px;letter-spacing:.02em;border-bottom:1px solid var(--line);}
.grpsep{border-left:2px solid var(--line)!important;}
#gtbl td.grpsep{border-left:2px solid var(--line);}
th.sortable{cursor:pointer;user-select:none;white-space:nowrap;}
th.sortable .ar{opacity:.35;font-size:9px;margin-left:2px;}
th.sortable.act .ar{opacity:1;color:var(--brand);}
.pager{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--sub);}
.pager button{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 11px;font-size:12.5px;font-family:inherit;}
.pager button:disabled{opacity:.4;cursor:default;}
.pager .sz{cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--sub);border-radius:6px;padding:3px 9px;font-size:12px;font-family:inherit;}
.pager .sz.on{background:var(--brand);border-color:var(--brand);color:#fff;}
/* 실행방안 카드 */
.planboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px;}
.plancard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;}
.plancard.adopted{border-color:var(--good);box-shadow:0 0 0 1px var(--good) inset,var(--shadow);}
.plancard .phead{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
.plancard .phead h3{margin:0;font-size:15px;font-weight:800;flex:1;min-width:120px;}
.plancard .psum{font-size:12.5px;color:var(--sub);margin:2px 0 10px;line-height:1.5;}
.plancard .psec{border-top:1px solid var(--line-2);padding:9px 0 2px;}
.plancard .psecl{font-size:11px;font-weight:700;color:var(--brand);text-transform:none;letter-spacing:.02em;margin-bottom:3px;}
.plancard .psecb{font-size:12.5px;white-space:pre-wrap;line-height:1.6;color:var(--ink);}
.plancard .pfoot{margin-top:10px;font-size:11px;color:var(--muted);}
.plancard .pacts{display:flex;gap:5px;flex-wrap:wrap;}
.pbtn{cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--sub);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:600;font-family:inherit;}
.pbtn:hover{border-color:var(--brand);color:var(--brand);}
.pbtn.danger:hover{border-color:var(--bad);color:var(--bad);}
.pbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.plancard textarea,.plancard input.pti{width:100%;font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface);color:var(--ink);}
.plancard textarea{min-height:52px;resize:vertical;line-height:1.5;}
.plancard input.pti{font-weight:700;font-size:14px;}
.pedit-sec{margin:7px 0;}
.pedit-sec .rowl{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.pedit-sec .rowl input{flex:1;font-weight:700;font-size:12px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);}
.toolbar .spacer{flex:1;}
td select,td input{padding:4px 6px; font-size:12px; width:100%;}
td input.memo{min-width:120px;}
.savedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;opacity:0;transition:opacity .3s;}
.dirtydot{color:var(--warn);margin-left:6px;font-size:11px;vertical-align:middle;}
.savebar{position:sticky;top:0;z-index:5;}
#wlSaveBtn.on{background:var(--warn);border-color:var(--warn);color:#fff;}
.savedot.on{opacity:1;}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
@media(max-width:620px){.statgrid{grid-template-columns:repeat(2,1fr);}}
.statmini{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;}
.statmini .l{font-size:11px;color:var(--sub);font-weight:600;}
.statmini .v{font-size:20px;font-weight:800;margin-top:2px;}
.insight{background:var(--surface-2); border-left:3px solid var(--brand); border-radius:0 8px 8px 0; padding:11px 15px; font-size:12.5px; margin-top:14px; color:var(--ink);}
.insight b{color:var(--brand);}
.dual{display:flex;gap:2px;height:26px;border-radius:6px;overflow:hidden;background:var(--line-2);}
.dual>span{display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;}
</style>
</head>

  // horizontal bars: items [{label,value,color?,sub?}], opts{fmt,maxLabel}
  hbar(items,{fmt=(v)=>v, unit='', max=null, h=null, showVal=true}={}){
    const W=560, rowH=30, padL=Math.max(...items.map(i=>i.label.length))*7+14, padR=54;

    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
    items.forEach((it,i)=>{
      const y=i*rowH+6, w=Math.max(2,bw*it.value/mx), col=it.color||'var(--brand)';
      s+=`<text x="${padL-8}" y="${y+18}" text-anchor="end">${it.label}</text>`;
      s+=`<rect class="barseg" x="${padL}" y="${y+5}" width="${w}" height="16" rx="4" fill="${col}"><title>${it.label}: ${fmt(it.value)}${unit}</title></rect>`;

    items.forEach((it,i)=>{
      const x=padL+i*bw, bh=(H-padB-padT)*it.value/mx, col=colorFn?colorFn(it,i):'var(--brand)';
      const w=bw*0.62, ox=x+(bw-w)/2;
      s+=`<rect class="barseg" x="${ox}" y="${H-padB-bh}" width="${w}" height="${Math.max(1,bh)}" rx="4" fill="${col}"><title>${it.label}: ${fmt(it.value)}${unit}</title></rect>`;
      s+=`<text class="val" x="${x+bw/2}" y="${H-padB-bh-6}" text-anchor="middle" style="font-size:10px">${fmt(it.value)}${unit}</text>`;
      s+=`<text x="${x+bw/2}" y="${H-padB+16}" text-anchor="middle">${it.label}</text>`;
    });
    return s+'</svg>';
  },
  // line
  line(items,{fmt=(v)=>v,unit=''}={}){
    const W=680,H=230,padB=40,padT=18,padL=30,padR=12;
    const mx=Math.max(...items.map(i=>i.value),1); const n=items.length;
    const xw=(W-padL-padR)/(n-1||1);
    const X=i=>padL+i*xw, Y=v=>H-padB-(H-padB-padT)*v/mx;
    let pts=items.map((it,i)=>`${X(i)},${Y(it.value)}`).join(' ');
    let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
    [0,.5,1].forEach(f=>{const y=padT+(H-padB-padT)*(1-f); s+=`<line class="axis" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/><text x="4" y="${y+4}" style="font-size:9px">${Math.round(mx*f)}</text>`;});
    s+=`<polyline fill="none" stroke="var(--brand)" stroke-width="2.5" points="${pts}"/>`;
    s+=`<polygon fill="var(--brand-soft)" opacity=".55" points="${padL},${H-padB} ${pts} ${X(n-1)},${H-padB}"/>`;
    items.forEach((it,i)=>{
      const wk=(it.wd==='토'||it.wd==='일');
      s+=`<circle class="barseg" cx="${X(i)}" cy="${Y(it.value)}" r="${wk?3.5:3}" fill="${wk?'var(--muted)':'var(--brand)'}"><title>${it.label}(${it.wd||''}): ${fmt(it.value)}${unit}</title></circle>`;
      if(i%Math.ceil(n/9)===0||i===n-1) s+=`<text x="${X(i)}" y="${H-padB+16}" text-anchor="middle" style="font-size:9px">${it.label.slice(5)}</text>`;
    });
    return s+'</svg>';
  },
  // donut items [{label,value,color}]
  donut(items,{fmt=(v)=>v,center=''}={}){
    const total=items.reduce((a,b)=>a+b.value,0); const R=70,r=44,cx=90,cy=90;
    let a=-Math.PI/2, s=`<svg class="chart" viewBox="0 0 180 180" style="max-width:200px">`;
    items.forEach(it=>{
      const ang=it.value/total*Math.PI*2, a2=a+ang;
      const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
      const xi1=cx+r*Math.cos(a2),yi1=cy+r*Math.sin(a2),xi2=cx+r*Math.cos(a),yi2=cy+r*Math.sin(a);
      const big=ang>Math.PI?1:0;
      s+=`<path class="barseg" d="M${x1},${y1} A${R},${R} 0 ${big} 1 ${x2},${y2} L${xi1},${yi1} A${r},${r} 0 ${big} 0 ${xi2},${yi2} Z" fill="${it.color}"><title>${it.label}: ${fmt(it.value)} (${(it.value/total*100).toFixed(1)}%)</title></path>`;
      a=a2;
    });
    s+=`<text x="90" y="86" text-anchor="middle" class="val" style="font-size:22px">${center||KRW(total)}</text>`;
    s+=`<text x="90" y="104" text-anchor="middle" style="font-size:10px">명</text>`;
    return s+'</svg>';
  },
  // 100% stacked horizontal for one row: segs [{value,color,label}]
  stack100(segs){
    const total=segs.reduce((a,b)=>a+b.value,0)||1;
    let s='<div class="dual">';
    segs.forEach(g=>{const w=g.value/total*100; if(w<0.5)return; s+=`<span style="flex:${g.value};background:${g.color}" title="${g.label}: ${g.value} (${w.toFixed(1)}%)">${w>9?w.toFixed(0)+'%':''}</span>`;});
    return s+'</div>';
  }
};
function legend(items){return `<div class="legend">${items.map(i=>`<span><i style="background:${i.color}"></i>${i.label}</span>`).join('')}</div>`;}

      <b>이용·도달</b> = 누가 얼마나 왔나 — <b>총 이용자수</b>(이 게임을 1번이라도 한 사람) · <b>게임카드 열어본 비율(도달율)</b>(신규 ${DATA.games_meta.base_users}명 중) &nbsp;|&nbsp;
      <b>실행 결과</b> = 실행한 뒤 어떻게 됐나(전체 <b>실행 횟수</b> 중 %) — <b>끝까지 완료</b> · <b>초기 진입만</b>(튜토리얼만 보고 이탈) · <b>중간 중단</b>
    </div>`;
  h+=`<div class="tw"><table id="gtbl"><thead>
    <tr>
      <th rowspan="2" data-k="name" class="sortable" style="vertical-align:bottom">게임명</th>
      <th colspan="2" class="grph">이용 · 도달</th>
      <th rowspan="2" class="r sortable grpsep" data-k="runs" style="vertical-align:bottom">실행 횟수</th>
      <th colspan="3" class="grph grpsep">실행 결과 (실행 건 기준 %)</th>
      <th rowspan="2" data-k="pat" style="vertical-align:bottom">활용 패턴</th>
    </tr>
    <tr>
      <th class="r sortable" data-k="users">총 이용자수</th>
      <th class="r sortable" data-k="reach">게임카드 열어본율<br><span style="font-weight:400;text-transform:none">(도달율)</span></th>
      <th class="r sortable grpsep" data-k="complete">끝까지 완료율</th>
      <th class="r sortable" data-k="entered">초기 진입만<br><span style="font-weight:400;text-transform:none">(튜토리얼 이탈)</span></th>
      <th class="r sortable" data-k="stopped">게임 중 중단율</th>
    </tr></thead><tbody></tbody></table></div>`;
  h+=`<div class="note" id="gnote"></div></div>`;
  setTimeout(()=>renderGames(),0);

  // 진성이탈 62명 게임 참여
  h+=`<div class="sec-title">🟡 진성이탈 ${DATA.vet_games_meta.base_users}명 — 이들이 실제로 하던 게임</div><div class="card"><h3>진성이탈자 게임별 참여·이탈 패턴</h3><div class="csub">30일+ 사용 후 멈춘 신규 ${DATA.vet_games_meta.base_users}명 · 도달율 높은 순 · "합데이터"가 아닌 이 그룹만 재집계</div>`;

  });
  h+=`</tbody></table></div>`;
  h+=`<div class="insight">진성이탈자는 게임 <b>도달율이 전체 평균의 1.5~2배</b>(예: 기억의 숨바꼭질 67.7%)로 <b>"안 써서" 떠난 게 아닙니다</b>. 다만 <b>오늘의 장바구니(진입만 81.5%)·숨은 헬씨 찾기(62.9%)</b>처럼 진입만 하고 나가는 게임, <b>초성퀴즈·단어기억하기(중단율 40%+)</b>처럼 난이도로 완주 못 하는 게임이 반복됩니다 → 콘텐츠 피로/난이도가 이탈에 관여했을 가능성. 설문 시 "어떤 게임이 지루하거나 어려웠는지"를 직접 물어야 합니다.</div>`;
  h+=`</div>`;

  h+=`<div class="sec-title">참여 타이밍</div><div class="grid g2">`;
  h+=`<div class="card"><h3>요일별 활동 비중</h3><div class="csub">고유 user×date · 주말 급감</div>${CH.vbar(DATA.weekday.map(w=>({label:w.label,value:w.pct})),{unit:'%',colorFn:(it)=>(it.label==='토'||it.label==='일')?'var(--muted)':'var(--brand)'})}</div>`;
  const hmax=DATA.hours.reduce((a,b)=>b.pct>a.pct?b:a,DATA.hours[0]);
  h+=`<div class="card"><h3>시간대별 접속 비중</h3><div class="csub">오후(12~18시) 최다 · 알림은 정오~오후 발송 유리</div>${CH.vbar(DATA.hours.map(x=>({label:x.label,value:x.pct})),{unit:'%',colorFn:(it)=>it.label===hmax.label?'var(--brand)':'var(--brand-soft)',max:40})}<div class="note">고유 user×date×시간대 기준. 참고: 원본 회신문서(부록 No.8)의 "아침 6~9시 집중"은 다른 집계 방식으로, 원시 S8 재집계에서는 재현되지 않아 실측값으로 대체했습니다.</div></div>`;
  h+=`</div>`;
  return h;
},
/* ---------- 건강·인구 ---------- */
'건강·인구':()=>{
  const d=DATA.demo;
  let h=`<div class="sec-title">인구 구성 — 신규 판정가능 ${d.base}명</div><div class="grid g2">`;
  h+=`<div class="card"><h3>연령대 분포</h3>${CH.hbar(d.age.map(a=>({label:a.label,value:a.n})),{unit:'명'})}</div>`;
  const sexc={F:'var(--c5)','미상':'var(--muted)',M:'var(--c1)'};
  h+=`<div class="card"><h3>성별</h3><div style="display:flex;justify-content:center">${CH.donut(d.sex.map(x=>({label:x.label,value:x.n,color:sexc[x.label]||'var(--muted)'})))}</div>${legend(d.sex.map(x=>({label:x.label+' '+x.n,color:sexc[x.label]||'var(--muted)'})))}</div>`;
  h+=`</div>`;
  h+=`<div class="grid g2" style="margin-top:14px">`;
  h+=`<div class="card"><h3>등록 경로 (대리지표)</h3><div class="csub">기관연결 여부로 대리</div>${CH.hbar(d.reg_path.map(x=>({label:x.label==='org_linked'?'기관연결(오프라인추정)':'자가가입추정',value:x.n})),{unit:'명'})}</div>`;
  h+=`<div class="card"><h3>기관(보건소) 상위</h3>${CH.hbar(d.provider.slice(0,7).map(x=>({label:x.label.length>14?x.label.slice(0,13)+'…':x.label,value:x.n})),{unit:'명'})}</div>`;
  h+=`</div>`;

  // ===== 검사(assessment) — 완료율 + 위험군 =====
  const ac=DATA.assess_completion;
  h+=`<div class="sec-title">검사(설문) 분석</div>`;
  h+=`<div class="card" style="margin-bottom:14px"><h3>"완료검사"란? — 그리고 절반 이상이 끝까지 안 합니다</h3>
    <div class="csub">검사 = 우울·불면·스트레스 등 자가진단 설문. "완료"=끝까지 응답(progress100) · "중도포기"=중간에 나감(50)</div>
    <div class="grid g2">
      <div class="statmini"><div class="l">대상 466명 · 검사 완료율</div><div class="v mono" style="color:var(--bad)">${ac.tgt_rate}%</div><div class="note" style="margin-top:4px">시도 ${KRW(ac.tgt_attempt)}건 중 완료 ${KRW(ac.tgt_complete)}건 · 중도포기 ${KRW(ac.tgt_stopped)}건</div></div>
      <div class="statmini"><div class="l">서비스 전체 · 검사 완료율</div><div class="v mono">${ac.svc_rate}%</div><div class="note" style="margin-top:4px">완료 ${KRW(ac.svc_complete)} · 중도포기 ${KRW(ac.svc_stopped)}</div></div>
    </div>
    <div class="insight">검사(설문)는 <b>시작해도 절반 이상이 끝까지 안 합니다</b>(대상 완료율 ${ac.tgt_rate}%). 설문이 길거나 어렵다는 신호 → 리텐션 설문을 붙일 때 <b>문항을 짧게</b> 설계해야 응답을 받습니다.</div>
  </div>`;
  h+=`<div class="card"><h3>위험군 분포 — 케어콜 연계 대상 규모</h3>
    <div class="csub">서비스 전체 완료검사 · 앱 자체 등급(level) 기준 · "관심이상"=우울/불면/스트레스 등 위험 신호 등급</div>`;
  h+=`<table><thead><tr><th>검사</th><th class="r">판정된 건수</th><th class="r">관심이상</th><th style="width:42%">정상 vs 관심이상</th></tr></thead><tbody>`;
  DATA.assess_risk.forEach(a=>{
    const segs=[{value:a.normal,color:'var(--good)',label:'정상'},{value:a.risk,color:a.risk_pct>=50?'var(--bad)':'var(--warn)',label:'관심이상'}];
    h+=`<tr><td><b>${a.label}</b></td><td class="r mono">${KRW(a.known)}</td><td class="r mono"><span class="pill ${a.risk_pct>=50?'bad':a.risk_pct>=25?'warn':'neut'}">${a.risk_pct}%</span></td><td>${CH.stack100(segs)}</td></tr>`;
  });
  h+=`</tbody></table>${legend([{label:'정상',color:'var(--good)'},{label:'관심이상(위험 신호)',color:'var(--warn)'}])}`;
  h+=`<div class="note">⚠️ 앱 등급(level)이 기록된 완료건만 집계(등급 미기록·점수공백 2025-11~2026-01 제외). 스트레스 관심이상 비율이 특히 높아, 마케팅이 아니라 <b>보건소 케어콜 연계</b>가 맞는 근거입니다.</div></div>`;

  h+=`<div class="sec-title">보조 지표</div><div class="grid g2">`;
  h+=`<div class="card"><h3>활동 그룹별 일평균 걸음수</h3><div class="csub">가입후무활동 / 이탈(90일+) / 활성(최근90일) · 차이 크지 않음 → 이탈 주원인 아님</div>${CH.hbar(DATA.steps.map(s=>({label:GRP_LABEL[s.label]||s.label,value:s.avg,color:s.label==='활성'?'var(--good)':s.label==='이탈'?'var(--warn)':'var(--bad)'})),{unit:'보',fmt:KRW})}</div>`;
  const f=DATA.funnel;
  h+=`<div class="card"><h3>가입 전 온보딩 퍼널</h3><div class="csub">보건소 신청 → 앱 가입</div>${CH.hbar([{label:'신청',value:f.applied},{label:'승인',value:f.approved},{label:'앱가입',value:f.signed}],{unit:'명'})}<div class="note">승인자의 ${(f.signed/f.approved*100).toFixed(0)}%가 실제 가입 — 미가입 ${f.not_signed}명(상한).</div></div>`;
  h+=`</div>`;
  return h;
},
/* ---------- 대상자 관리 (편집) ---------- */

    <div class="csub" style="margin-bottom:10px">앞 탭들은 "몇 %가 이탈"인지 <b>숫자</b>를 봤다면, 여기서는 그 대상 <b>${DATA.watchlist_meta.n}명을 한 명 한 명 명단으로</b> 보고 누구에게 무엇을 할지 정합니다.</div>

        <span class="pill bad">이탈임박</span> 20~29일 무접속(곧 이탈) ·
        <span class="pill warn">단기이탈</span> 30~89일 ·
        <span class="pill warn">장기이탈</span> 90일+ ·
        <span class="pill good">유지</span> 최근 활동 있음(연락 불필요)<br>
      • <b>사용법</b>: 담당자를 나눠 배정 → 통화/문자 후 <b>대응상태</b>를 미착수→진행중→완료로 바꾸고 <b>메모</b>에 결과 기록. 수정하면 "저장 안 됨"으로 표시되고, <b>💾 저장</b>을 눌러야 확정됩니다(그때 <b>최종수정 시각</b>이 기록됨).<br>

      • <b>선택·일괄관리</b>: 왼쪽 체크박스로 여러 명을 고른 뒤 <b>진행상태·담당자를 한 번에</b> 적용할 수 있습니다.<br>

    </div>
    <div style="margin-top:14px;border-top:1px solid var(--line-2);padding-top:12px">

      </tbody></table>
      <div class="note" style="margin-top:8px">📌 공통: 검사 위험군(스트레스·우울·불면 관심이상)은 위험도와 무관하게 마케팅에서 빼고 <b>보건소 케어콜로 분리 연계</b>. · <span class="pill good">유지</span>는 연락 불필요.</div>

function computeAssignment(){
  const key=r=>[(r.dsl==null?0:r.dsl), r.id];
  const cmp=(a,b)=>{const ka=key(a),kb=key(b);return ka[0]-kb[0]||(ka[1]<kb[1]?-1:ka[1]>kb[1]?1:0);};
  const short=DATA.watchlist.filter(r=>r.risk==='단기이탈').sort(cmp);
  const A=short.filter((_,i)=>i%2===0), B=short.filter((_,i)=>i%2===1);
  const buckets={'온보딩실패':DATA.watchlist.filter(r=>r.risk==='온보딩실패').sort(cmp),
    '이탈임박':DATA.watchlist.filter(r=>r.risk==='이탈임박').sort(cmp),
    '단기이탈-A(리워드)':A,'단기이탈-B(사용지원)':B,
    '장기이탈':DATA.watchlist.filter(r=>r.risk==='장기이탈').sort(cmp)};
  const out={};
  SEG_ORDER.forEach(seg=>{const rows=buckets[seg],cnt=MATRIX[seg];let idx=0;
    cnt.forEach((n,si)=>{for(let k=0;k<n&&idx<rows.length;k++){out[rows[idx].id]={owner:STAFF[si],seg:seg};idx++;}});});

}

  /* ===== Google Sheets 연동 (배포 페이지에서만 동작 · Artifact는 외부연결 차단) ===== */
  function gsUrl(){return ($('#gsUrl').value||'').trim();}

  async function gsPush(silent){const url=gsUrl(); if(!url){if(!silent)alert('먼저 Apps Script 웹앱 URL을 입력하세요.');return;}
    try{setGsStat('시트 전송 중…');
      const res=await fetch(url,{method:'POST',body:JSON.stringify({action:'save',rows:gsRows()})});
      const d=await res.json();
      setGsStat('시트 저장됨 · '+new Date().toLocaleTimeString('ko-KR'),true); if(!silent)toast(`시트에 ${d.count??gsRows().length}건 전송됨`);
    }catch(err){setGsStat('시트 연결 실패 — 배포 페이지에서만 동작',false); if(!silent)toast('시트 연결 실패(배포 페이지에서 사용)',false);}
  }
  async function gsLoad(){const url=gsUrl(); if(!url){alert('먼저 Apps Script 웹앱 URL을 입력하세요.');return;}
    try{setGsStat('불러오는 중…');
      const res=await fetch(url); const d=await res.json(); const rows=d.rows||d||[];
      const valid=new Set(DATA.watchlist.map(r=>r.id)); let ok=0;
      rows.forEach(r=>{const id=(r.id||'').trim(); if(!id||!valid.has(id))return;
        const cur=wlEdits[id]||{};
        if(r.seg)cur.seg=r.seg; if(r.status)cur.status=r.status; if(r.owner!=null&&r.owner!=='')cur.owner=r.owner;
        if(r.call_result)cur.call_result=r.call_result; if(r.conversion)cur.conversion=r.conversion; if(r.reengaged)cur.reengaged=r.reengaged;
        if(r.memo!=null&&r.memo!=='')cur.memo=r.memo; if(r.updated_at)cur.updated_at=r.updated_at;
        if(Object.keys(cur).length){wlEdits[id]=cur;ok++;}});
      saveEdits(); wlDirty.clear(); draw(); setGsStat('시트에서 불러옴 · '+ok+'건',true); toast(`시트에서 ${ok}건 불러옴`);
    }catch(err){setGsStat('시트 연결 실패 — 배포 페이지에서만 동작',false); toast('시트 연결 실패(배포 페이지에서 사용)',false);}
  }

  $('#gsLoad').addEventListener('click',gsLoad);
  // 자동 새로고침(모니터링): 30초마다 시트에서 불러옴 · 미저장 편집이 있으면 건너뜀(덮어쓰기 방지)

  $('#wlExport').addEventListener('click',()=>{
    if(wlDirty.size && confirm(`저장되지 않은 변경 ${wlDirty.size}건이 있습니다. 저장 후 내보낼까요?`)) saveCommit();
    const src=wlSel.size?wlFilter().filter(r=>wlSel.has(r.id)):wlFilter();
    const lines=[CSV_HDR.map(csvCell).join(',')].concat(src.map(r=>{const e=wlEdits[r.id]||{};
      return [r.id,r.name,r.age,r.sex,r.prov,r.dsl,r.risk,e.seg||'',e.owner||'',e.status||'미착수',e.call_result||'',e.conversion||'',e.reengaged||'',e.memo||'',e.updated_at||''].map(csvCell).join(',');}));

  $('#wlImport').addEventListener('click',()=>$('#wlFile').click());
  $('#wlFile').addEventListener('change',e=>{const file=e.target.files[0]; if(!file)return;
    const rd=new FileReader(); rd.onload=()=>{
      try{const rows=parseCSV(rd.result); const head=rows.shift()||[];
        const ci=n=>head.indexOf(n);
        const iId=ci('id'),iSeg=ci('세그먼트'),iOw=ci('담당자'),iSt=ci('진행상태'),iCr=ci('통화결과'),iCv=ci('핵심전환'),iRe=ci('1주후재접속'),iMe=ci('메모'),iUp=ci('최종수정');

          if(g(iCr))cur.call_result=r[iCr].trim(); if(g(iCv))cur.conversion=r[iCv].trim(); if(g(iRe))cur.reengaged=r[iRe].trim();

    }; rd.readAsText(file,'utf-8');
  });

/* games sort */
let gSort='users',gAsc=false;
function renderGames(){
  const tb=$('#gtbl tbody'); const rows=[...DATA.games].sort((a,b)=>{const x=a[gSort],y=b[gSort];return (x<y?-1:x>y?1:0)*(gAsc?1:-1);});
  tb.innerHTML=rows.map(g=>{
    let pat='';
    if(g.entered>=55) pat='<span class="pill warn">미리보기 후 이탈</span>';
    else if(g.stopped>=38) pat='<span class="pill bad">완주 실패(난이도)</span>';
    else if(g.complete>=70) pat='<span class="pill good">건강</span>';
    else pat='<span class="pill neut">–</span>';
    return `<tr><td>${g.name}</td><td class="r mono">${g.users}</td><td class="r mono">${g.reach}%</td><td class="r mono grpsep">${KRW(g.runs)}</td><td class="r mono grpsep">${g.complete}%</td><td class="r mono">${g.entered}%</td><td class="r mono">${g.stopped}%</td><td>${pat}</td></tr>`;
  }).join('');
  $('#gnote').innerHTML='실제 1위는 <b>기억의 숨바꼭질</b>(도달·완료 모두 우수). <b>숫자퍼즐 9X9</b>는 중단율 최고(난이도), <b>양말정리·오늘의 장바구니</b>는 진입만율 높음(UI 이탈).';
}

  return `<div class="plancard ${p.status==='채택'?'adopted':''}" data-pid="${p.id}">
    <div class="phead"><span class="pill ${planStatusPill(p.status)}">${escH(p.status)}</span><h3>${escH(p.title)}</h3></div>
    <div class="pacts">${p.status==='채택'?'':'<button class="pbtn primary" data-act="adopt">✓ 채택</button>'}
      <button class="pbtn" data-act="edit">편집</button><button class="pbtn" data-act="dup">복제</button><button class="pbtn danger" data-act="del">삭제</button></div>
    <div class="psum">${escH(p.summary)}</div>
    ${p.sections.map(s=>`<div class="psec"><div class="psecl">${escH(s.l)}</div><div class="psecb">${escH(s.b)}</div></div>`).join('')}
    <div class="pfoot">최종수정 ${p.updated_at||'–'}</div></div>`;
}
function planCardEdit(p){
  return `<div class="plancard" data-pid="${p.id}">
    <div class="phead"><select data-ef="status">${PLAN_STATUS.map(o=>`<option ${o===p.status?'selected':''}>${o}</option>`).join('')}</select>
      <input class="pti" data-ef="title" value="${escA(p.title)}" placeholder="방안 제목"/></div>
    <textarea data-ef="summary" placeholder="한 줄 요약">${escH(p.summary)}</textarea>
    <div data-secs>${p.sections.map((s,i)=>`<div class="pedit-sec" data-si="${i}">
      <div class="rowl"><input data-sf="l" value="${escA(s.l)}" placeholder="항목명"/><button class="pbtn danger" data-act="secdel">－</button></div>
      <textarea data-sf="b" placeholder="내용">${escH(s.b)}</textarea></div>`).join('')}</div>
    <div class="pacts" style="margin-top:8px"><button class="pbtn" data-act="secadd">＋ 항목</button>
      <span style="flex:1"></span><button class="pbtn primary" data-act="save">💾 저장</button><button class="pbtn" data-act="cancel">취소</button></div></div>`;
}
function renderPlans(){
  const board=$('#planBoard'); if(!board)return;
  board.className='planboard';
  board.innerHTML=plans.map(p=>plansEditing===p.id?planCardEdit(p):planCardView(p)).join('');
  const st=$('#planStat'); if(st){const ad=plans.filter(p=>p.status==='채택').length;
    st.textContent=`총 ${plans.length}개 · 채택 ${ad}${plansSaved?' · 저장됨 '+plansSaved:''}`;}
}
function readEdit(card){ // 편집 중인 카드 DOM → plan 객체
  const p=plans.find(x=>x.id===card.dataset.pid); if(!p)return null;
  p.title=card.querySelector('[data-ef=title]').value;
  p.summary=card.querySelector('[data-ef=summary]').value;
  p.status=card.querySelector('[data-ef=status]').value;
  p.sections=[...card.querySelectorAll('.pedit-sec')].map(sec=>({l:sec.querySelector('[data-sf=l]').value, b:sec.querySelector('[data-sf=b]').value}));
  return p;
}
function initPlans(){
  renderPlans();
  $('#planBoard').addEventListener('click',e=>{const btn=e.target.closest('[data-act]'); if(!btn)return;
    const card=e.target.closest('.plancard'); const pid=card.dataset.pid; const idx=plans.findIndex(x=>x.id===pid); const p=plans[idx];
    const act=btn.dataset.act;
    if(act==='edit'){plansEditing=pid; renderPlans();}
    else if(act==='cancel'){plansEditing=null; plans=JSON.parse(localStorage.getItem(PLAN_KEY))||plans; renderPlans();}
    else if(act==='save'){readEdit(card); p.updated_at=stamp(); plansEditing=null; savePlans(); renderPlans(); toast('방안 저장됨');}
    else if(act==='adopt'){p.status='채택'; p.updated_at=stamp(); savePlans(); renderPlans(); toast(`'${p.title}' 채택`);}
    else if(act==='dup'){const c=JSON.parse(JSON.stringify(p)); c.id=newId(); c.title=p.title+' (복제)'; c.status='검토중'; c.updated_at=stamp(); plans.splice(idx+1,0,c); savePlans(); renderPlans(); toast('복제됨');}
    else if(act==='del'){if(confirm(`'${p.title}' 방안을 삭제할까요?`)){plans.splice(idx,1); if(plansEditing===pid)plansEditing=null; savePlans(); renderPlans(); toast('삭제됨',false);}}
    else if(act==='secadd'){readEdit(card); p.sections.push({l:'',b:''}); renderPlans();}
    else if(act==='secdel'){readEdit(card); const si=+e.target.closest('.pedit-sec').dataset.si; p.sections.splice(si,1); renderPlans();}
  });
  $('#planAdd').addEventListener('click',()=>{const p={id:newId(),status:'검토중',title:'새 방안',summary:'',sections:PLAN_TMPL.map(l=>({l,b:''})),updated_at:''}; plans.push(p); plansEditing=p.id; savePlans(); renderPlans();});
  $('#planReset').addEventListener('click',()=>{if(confirm('편집한 내용을 버리고 기본 3안으로 되돌립니다. 계속할까요?')){plans=seedPlans(); plansEditing=null; savePlans(); renderPlans();}});
  $('#planExport').addEventListener('click',()=>{
    const md=plans.map(p=>`# ${p.title}  (${p.status})\n\n${p.summary}\n\n`+p.sections.map(s=>`## ${s.l}\n${s.b}`).join('\n\n')).join('\n\n---\n\n');
    const blob=new Blob(['﻿'+md],{type:'text/markdown'}); const a=el('a'); a.href=URL.createObjectURL(blob); a.download='맬리_이벤트_실행방안.md'; a.click();
  });
}

const ORDER=['개요','기수·세그먼트','이탈·리텐션','콘텐츠·게임','건강·인구','대상자 관리','실행방안'];
const ICON={'개요':'📊','기수·세그먼트':'👥','이탈·리텐션':'📉','콘텐츠·게임':'🎮','건강·인구':'🩺','대상자 관리':'✏️','실행방안':'🎯'};
function route(name){
  $('#app').innerHTML=`<div class="view active">${VIEWS[name]()}</div>`;
  [...$('#tabs').children].forEach(b=>b.classList.toggle('active',b.dataset.n===name));
  location.hash=encodeURIComponent(name);
}
function build(){
  $('#tabs').innerHTML=ORDER.map(n=>`<button data-n="${n}">${ICON[n]} ${n}</button>`).join('');
  [...$('#tabs').children].forEach(b=>b.onclick=()=>route(b.dataset.n));
  $('#chipN').textContent=KRW(DATA.overview.c26_total)+'명';
  $('#chipAll').textContent=KRW(DATA.overview.users_total)+'명';
  const init=decodeURIComponent(location.hash.slice(1)); route(ORDER.includes(init)?init:'개요');
}
$('#themeBtn').onclick=()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  $('#themeBtn').innerHTML=dark?'🌙 <span>다크</span>':'☀️ <span>라이트</span>';
  localStorage.setItem('malli_theme',dark?'light':'dark');
};
if(localStorage.getItem('malli_theme')==='dark'){document.documentElement.setAttribute('data-theme','dark');$('#themeBtn').innerHTML='☀️ <span>라이트</span>';}
build();
</script>
</body>
