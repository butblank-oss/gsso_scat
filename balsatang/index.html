<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>발사탕 — 강아지 사료 검색</title>
<meta name="description" content="강아지 사료 성분 분석과 비교. 우리 아이에게 맞는 사료를 찾아보세요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
/* ─── Reset & Base ─────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px;-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  background:#FAFAF9;color:#111;line-height:1.5;
  min-height:100vh;min-height:100dvh;
  overscroll-behavior:none;
}
button{font:inherit;background:none;border:none;cursor:pointer;color:inherit}
input{font:inherit}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}

/* ─── Design Tokens ─────────────────────────────────────── */
:root{
  --accent:#FF5500;
  --accent2:#FF6B1A;
  --accent-light:#FFF1EB;
  --accent-mid:#FFD4B8;
  --good:#16A34A;
  --good-soft:#F0FDF4;
  --good-mid:#BBF7D0;
  --warn:#D97706;
  --warn-soft:#FFFBEB;
  --warn-mid:#FDE68A;
  --bad:#DC2626;
  --bad-soft:#FEF2F2;
  --bad-mid:#FECACA;
  --ink:#111111;
  --ink2:#333333;
  --sub:#6B7280;
  --muted:#9CA3AF;
  --line:#E5E7EB;
  --line2:#F3F4F6;
  --bg:#FAFAF9;
  --surface:#FFFFFF;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:20px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --shadow-lg:0 12px 40px rgba(0,0,0,.12),0 4px 12px rgba(0,0,0,.06);
  --ease:cubic-bezier(.4,0,.2,1);
  --nav-h:60px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* ─── Screens ───────────────────────────────────────────── */
.screen{
  position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--bg);
  transition:opacity .2s var(--ease),transform .25s var(--ease);
  padding-bottom:calc(var(--nav-h) + var(--safe-bottom));
  display:none;
}
.screen.active{display:block}
.screen.slide-up{
  padding-bottom:0;
  transform:translateY(100%);transition:transform .3s var(--ease);
}
.screen.slide-up.active{transform:translateY(0)}

/* ─── Bottom Nav ────────────────────────────────────────── */
#nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  display:flex;align-items:stretch;
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:8px 0;
  color:var(--muted);transition:color .15s;
  font-size:10px;font-weight:600;letter-spacing:-.2px;
}
.nav-btn.on{color:var(--accent)}
.nav-btn svg{width:22px;height:22px;transition:transform .2s var(--ease)}
.nav-btn.on svg{transform:scale(1.1)}

/* ─── Header ────────────────────────────────────────────── */
.hd{
  position:sticky;top:0;z-index:50;
  background:rgba(250,250,249,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:14px 20px 12px;
}
.hd-row{display:flex;align-items:center;gap:10px}
.hd-title{font-size:18px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.hd-sub{font-size:12px;color:var(--sub);margin-top:1px}
.hd-logo{display:flex;align-items:center;gap:8px;flex:1}
.logo-mark{
  width:32px;height:32px;border-radius:10px;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
}
.logo-mark svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ─── Concern Chips ─────────────────────────────────────── */
.chips-wrap{
  overflow-x:auto;padding:12px 20px 10px;
  scrollbar-width:none;-ms-overflow-style:none;
  display:flex;gap:8px;
}
.chips-wrap::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 14px;border-radius:100px;
  border:1.5px solid var(--line);background:var(--surface);
  font-size:13px;font-weight:600;color:var(--sub);
  cursor:pointer;transition:all .18s var(--ease);white-space:nowrap;
}
.chip.on{
  background:var(--accent);border-color:var(--accent);color:#fff;
  box-shadow:0 2px 10px rgba(255,85,0,.25);
}

/* ─── Section Headers ───────────────────────────────────── */
.sec{margin-top:20px}
.sec-hd{
  padding:0 20px 10px;
  display:flex;align-items:baseline;gap:8px;
}
.sec-title{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.4px}
.sec-count{font-size:12px;color:var(--muted)}

/* ─── Horizontal Card Scroll ────────────────────────────── */
.hscroll{
  overflow-x:auto;padding:4px 20px 8px;
  display:flex;gap:10px;scrollbar-width:none;
}
.hscroll::-webkit-scrollbar{display:none}

/* ─── H-Card (horizontal scroll card) ──────────────────── */
.hcard{
  flex-shrink:0;width:160px;padding:14px;border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);
  cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  border:1.5px solid var(--line);
}
.hcard:active,.hcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.hcard-thumb{
  width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;margin-bottom:10px;
  background:var(--line2);
}
.hcard-brand{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.2px;text-transform:uppercase;margin-bottom:2px}
.hcard-name{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:8px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hcard-score{
  display:flex;align-items:center;gap:6px;
}
.score-badge{
  font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px;
}
.score-badge.good{background:var(--good-soft);color:var(--good)}
.score-badge.warn{background:var(--warn-soft);color:var(--warn)}
.score-badge.bad{background:var(--bad-soft);color:var(--bad)}
.hcard-type{font-size:10px;color:var(--muted)}

/* ─── Food Card (vertical list) ─────────────────────────── */
.food-list{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.fcard{
  background:var(--surface);border-radius:var(--r-lg);
  border:1.5px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;padding:14px;
  cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease);
  animation:fadeUp .3s var(--ease) both;
}
.fcard:active,.fcard:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fcard-thumb{
  width:48px;height:48px;flex-shrink:0;border-radius:12px;
  background:var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:22px;
}
.fcard-info{flex:1;min-width:0}
.fcard-brand{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.2px;text-transform:uppercase;margin-bottom:1px}
.fcard-name{font-size:14px;font-weight:700;color:var(--ink);line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard-tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.tag{
  font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;
  display:flex;align-items:center;gap:3px;
}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.rx{background:#EEF2FF;color:#4F46E5}
.tag.type{background:var(--line2);color:var(--sub)}
.fcard-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.fcard-score{
  width:36px;height:36px;position:relative;display:flex;align-items:center;justify-content:center;
}
.fcard-score svg{position:absolute;inset:0;width:100%;height:100%}
.fcard-score-val{font-size:11px;font-weight:800;position:relative;z-index:1}
.fcard-price{font-size:10px;color:var(--muted);font-weight:600}

/* ─── Search Screen ─────────────────────────────────────── */
.search-box{padding:14px 20px 0}
.search-input-wrap{
  position:relative;display:flex;align-items:center;
}
.search-ico{
  position:absolute;left:14px;color:var(--muted);
  display:flex;pointer-events:none;
}
.search-ico svg{width:17px;height:17px}
.search-input{
  width:100%;padding:11px 14px 11px 42px;border-radius:var(--r-md);
  border:1.5px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:500;color:var(--ink);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,85,0,.1)}
.search-input::placeholder{color:var(--muted)}

.filter-bar{
  padding:10px 20px 0;display:flex;gap:8px;overflow-x:auto;
  scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{
  flex-shrink:0;padding:5px 12px;border-radius:100px;
  border:1.5px solid var(--line);background:var(--surface);
  font-size:12px;font-weight:600;color:var(--sub);cursor:pointer;
  transition:all .15s;
}
.filter-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

.search-results{padding:12px 20px;display:flex;flex-direction:column;gap:8px}
.search-empty{
  padding:60px 20px;text-align:center;color:var(--muted);
}
.search-empty svg{width:48px;height:48px;margin:0 auto 12px;opacity:.3}
.search-empty p{font-size:14px;font-weight:600}

/* ─── Detail Screen ─────────────────────────────────────── */
#detail{
  background:var(--surface);
}
.detail-hd{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
}
.back-btn{
  width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--line2);cursor:pointer;
  transition:background .15s;
}
.back-btn:active{background:var(--line)}
.back-btn svg{width:18px;height:18px}
.detail-hd-info{flex:1;min-width:0}
.detail-hd-brand{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.2px;text-transform:uppercase}
.detail-hd-name{font-size:15px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.detail-hero{
  padding:24px 20px 20px;
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--line);
}
.detail-thumb{
  width:72px;height:72px;border-radius:16px;
  background:var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:32px;flex-shrink:0;
  box-shadow:var(--shadow-sm);
}
.detail-meta{flex:1;min-width:0}
.detail-brand{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:3px}
.detail-name{font-size:18px;font-weight:800;color:var(--ink);line-height:1.2;letter-spacing:-.4px;margin-bottom:8px}
.detail-badges{display:flex;gap:6px;flex-wrap:wrap}
.dbadge{
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;
  display:inline-flex;align-items:center;gap:4px;
}
.dbadge.good{background:var(--good-soft);color:var(--good)}
.dbadge.warn{background:var(--warn-soft);color:var(--warn)}
.dbadge.rx{background:#EEF2FF;color:#4F46E5}
.dbadge.type{background:var(--line2);color:var(--sub)}
.dbadge.age{background:var(--accent-light);color:var(--accent)}

/* Score Hero */
.score-hero{
  padding:20px;background:var(--surface);
  display:flex;align-items:center;gap:16px;
}
.score-circle{position:relative;width:76px;height:76px;flex-shrink:0}
.score-circle svg{width:100%;height:100%}
.score-circle-val{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.score-circle-num{font-size:18px;font-weight:900;color:var(--ink)}
.score-circle-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.score-info{flex:1}
.score-grade{font-size:16px;font-weight:800;color:var(--ink);margin-bottom:4px}
.score-desc{font-size:12px;color:var(--sub);line-height:1.5}

/* Sub-scores grid */
.sub-scores{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--line);margin:0 0 2px;
}
.sub-score{
  background:var(--surface);padding:12px 8px;text-align:center;
}
.sub-score-lbl{font-size:10px;color:var(--muted);font-weight:600;margin-bottom:5px}
.sub-score-stars{display:flex;justify-content:center;gap:2px;margin-bottom:3px}
.sub-score-stars span{width:7px;height:7px;border-radius:2px}
.sub-score-stars span.on{background:var(--accent)}
.sub-score-stars span.off{background:var(--line)}
.sub-score-desc{font-size:9px;color:var(--muted);line-height:1.3}

/* Tabs */
.dtab-bar{
  display:flex;border-bottom:2px solid var(--line);
  background:var(--surface);position:sticky;top:65px;z-index:40;
}
.dtab{
  flex:1;padding:12px;text-align:center;
  font-size:13px;font-weight:700;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;
}
.dtab.on{color:var(--accent);border-color:var(--accent)}

.dtab-panel{display:none;padding:0 0 20px}
.dtab-panel.on{display:block}

/* Verdict cards */
.verdict-section{padding:16px 20px 4px}
.verdict-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}
.verdict-card{
  padding:12px 14px;border-radius:var(--r-md);
  display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;
  border:1.5px solid transparent;
}
.verdict-card.pos{background:var(--good-soft);border-color:var(--good-mid)}
.verdict-card.cau{background:var(--warn-soft);border-color:var(--warn-mid)}
.verdict-card.bad{background:var(--bad-soft);border-color:var(--bad-mid)}
.verdict-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.verdict-text-title{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
.verdict-text-body{font-size:12px;color:var(--sub);line-height:1.5}

/* Ingredients */
.ingr-section{padding:16px 20px 0}
.ingr-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}
.ingr-list{display:flex;flex-direction:column;gap:6px}
.ingr-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface);border-radius:var(--r-md);
  border:1.5px solid var(--line);
}
.ingr-rank{
  width:20px;height:20px;border-radius:6px;
  background:var(--line2);display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;color:var(--muted);
  flex-shrink:0;
}
.ingr-name{flex:1;font-size:13px;font-weight:700;color:var(--ink)}
.ingr-badge{
  font-size:10px;font-weight:700;padding:2px 8px;border-radius:5px;
}
.ingr-badge.safe{background:var(--good-soft);color:var(--good)}
.ingr-badge.caution{background:var(--warn-soft);color:var(--warn)}
.ingr-badge.danger{background:var(--bad-soft);color:var(--bad)}
.ingr-main{font-size:9px;font-weight:700;color:var(--muted);margin-right:2px}

/* Fit profiles */
.fit-section{padding:16px 20px 0}
.fit-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}
.fit-group{margin-bottom:8px}
.fit-group-lbl{font-size:11px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:4px}
.fit-group-lbl.fit-lbl{color:var(--good)}
.fit-group-lbl.cau-lbl{color:var(--warn)}
.fit-item{
  padding:10px 12px;border-radius:var(--r-md);margin-bottom:5px;
  font-size:12px;line-height:1.5;font-weight:600;
}
.fit-item.fit{background:var(--good-soft);color:#15803D;border:1.5px solid var(--good-mid)}
.fit-item.cau{background:var(--warn-soft);color:#92400E;border:1.5px solid var(--warn-mid)}

/* Nutrient bars */
.nutr-section{padding:16px 20px 0}
.nutr-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}
.nutr-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nutr-item{
  background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:12px;
}
.nutr-lbl{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:4px}
.nutr-val{font-size:16px;font-weight:900;color:var(--ink)}
.nutr-val span{font-size:10px;font-weight:600;color:var(--muted)}
.nutr-bar-wrap{height:4px;background:var(--line);border-radius:2px;margin:6px 0 4px;overflow:hidden}
.nutr-bar{height:100%;border-radius:2px;transition:width .6s var(--ease)}
.nutr-note{font-size:9px;color:var(--muted)}

/* Recall */
.recall-box{
  margin:16px 20px 0;padding:12px 14px;border-radius:var(--r-md);
  display:flex;gap:8px;align-items:flex-start;font-size:12px;font-weight:600;
  border:1.5px solid;
}
.recall-box.clear{background:var(--good-soft);border-color:var(--good-mid);color:#15803D}
.recall-box.alert{background:var(--bad-soft);border-color:var(--bad-mid);color:#B91C1C}
.recall-box svg{width:15px;height:15px;flex-shrink:0;margin-top:1px}

/* Feeding calc */
.calc-card{
  margin:16px 20px 0;padding:16px;
  background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
}
.calc-title{font-size:14px;font-weight:800;color:var(--ink);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.calc-sub{font-size:11px;color:var(--muted);margin-bottom:14px}
.calc-field{margin-bottom:14px}
.calc-field-lbl{font-size:11px;font-weight:700;color:var(--sub);margin-bottom:6px}
.weight-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.weight-num-input{
  width:80px;padding:8px 10px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);font-size:16px;font-weight:700;
  text-align:center;outline:none;transition:border-color .15s;
}
.weight-num-input:focus{border-color:var(--accent)}
.weight-unit{font-size:12px;font-weight:600;color:var(--sub)}
.weight-slider{
  width:100%;accent-color:var(--accent);height:4px;
  -webkit-appearance:none;appearance:none;
  background:var(--line);border-radius:2px;outline:none;cursor:pointer;
}
.weight-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);box-shadow:0 2px 6px rgba(255,85,0,.3);cursor:pointer;
}
.meal-btns,.bag-btns{display:flex;gap:6px;flex-wrap:wrap}
.meal-btn,.bag-btn{
  padding:7px 14px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);
  font-size:12px;font-weight:700;color:var(--sub);
  transition:all .15s;
}
.meal-btn.on,.bag-btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.calc-hl{
  background:var(--accent-light);border:1.5px solid var(--accent-mid);
  border-radius:var(--r-md);padding:12px;
  display:flex;gap:0;align-items:stretch;margin-bottom:14px;
}
.calc-hl-cell{flex:1;text-align:center}
.calc-hl-divider{width:1px;background:var(--accent-mid);margin:0 12px}
.calc-hl-lbl{font-size:10px;font-weight:600;color:var(--accent);margin-bottom:4px}
.calc-hl-val{font-size:22px;font-weight:900;color:var(--accent)}
.calc-hl-val span{font-size:11px;font-weight:600;margin-left:2px}
.bag-custom-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bag-custom-lbl{font-size:11px;color:var(--muted);flex-shrink:0}
.bag-custom-input{
  width:70px;padding:6px 8px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);font-size:13px;font-weight:700;
  text-align:center;outline:none;
}
.bag-custom-input:focus{border-color:var(--accent)}
.bag-days{font-size:12px;color:var(--sub);margin-top:8px;font-weight:600}
.calc-hint{font-size:10px;color:var(--muted);margin-top:8px;line-height:1.5}

/* Price section */
.price-section{margin:16px 20px 0}
.price-title{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;margin-bottom:10px}
.price-card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.price-row{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--line);
}
.price-row:last-child{border-bottom:none}
.price-info{flex:1}
.price-shop{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:3px}
.price-amt{font-size:16px;font-weight:900;color:var(--ink)}
.price-pkg{font-size:11px;color:var(--muted)}
.price-per-kg{font-size:10px;color:var(--sub);font-weight:600}
.price-btn-buy{
  padding:8px 16px;border-radius:var(--r-sm);
  background:var(--accent);color:#fff;
  font-size:12px;font-weight:800;
  transition:opacity .15s;
}
.price-btn-buy:active{opacity:.8}
.price-btn-none{
  padding:8px 12px;border-radius:var(--r-sm);
  background:var(--line2);color:var(--muted);
  font-size:12px;font-weight:700;cursor:not-allowed;
}
.price-note{font-size:10px;color:var(--muted);margin-top:8px}

/* ─── Compare Screen ─────────────────────────────────────── */
#compare{background:var(--bg)}
.compare-slots{display:flex;gap:10px;padding:16px 20px 12px}
.cmp-slot{
  flex:1;border-radius:var(--r-lg);
  border:2px dashed var(--line);padding:14px 12px;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;cursor:pointer;min-height:90px;
  transition:all .18s;background:var(--surface);
  text-align:center;
}
.cmp-slot.filled{border-style:solid;border-color:var(--accent);background:var(--accent-light)}
.cmp-slot.filled:active{opacity:.8}
.cmp-slot-brand{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.3px;text-transform:uppercase}
.cmp-slot-name{font-size:12px;font-weight:800;color:var(--ink);line-height:1.3}
.cmp-slot-score{font-size:18px;font-weight:900;color:var(--accent)}
.cmp-slot-plus{
  width:36px;height:36px;border-radius:50%;
  background:var(--line2);display:flex;align-items:center;justify-content:center;
  color:var(--muted);
}
.cmp-slot-plus svg{width:18px;height:18px}
.cmp-slot-empty-lbl{font-size:12px;font-weight:600;color:var(--muted)}

.cmp-btn{
  margin:0 20px;padding:14px;border-radius:var(--r-lg);
  background:var(--accent);color:#fff;width:calc(100% - 40px);
  font-size:14px;font-weight:800;transition:opacity .15s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.cmp-btn:active{opacity:.8}
.cmp-btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}

.cmp-table-wrap{
  margin:16px 20px 0;background:var(--surface);
  border-radius:var(--r-lg);border:1.5px solid var(--line);overflow:hidden;
}
.cmp-table-hd{
  display:grid;grid-template-columns:90px 1fr 1fr;
  background:var(--line2);border-bottom:1.5px solid var(--line);
}
.cmp-table-hd div{padding:10px 12px;font-size:11px;font-weight:700;color:var(--sub)}
.cmp-table-row{
  display:grid;grid-template-columns:90px 1fr 1fr;
  border-bottom:1px solid var(--line);
}
.cmp-table-row:last-child{border-bottom:none}
.cmp-table-label{padding:12px;font-size:11px;font-weight:700;color:var(--muted);background:var(--line2)}
.cmp-table-val{padding:12px;font-size:13px;font-weight:700;color:var(--ink);border-left:1px solid var(--line)}
.cmp-table-val.highlight{background:var(--accent-light);color:var(--accent)}

/* ─── Picker Screen ─────────────────────────────────────── */
#picker{background:var(--bg)}

/* ─── Empty state ────────────────────────────────────────── */
.empty-state{
  padding:60px 20px;text-align:center;
}
.empty-state svg{width:56px;height:56px;margin:0 auto 14px;opacity:.2}
.empty-state-title{font-size:15px;font-weight:700;color:var(--sub);margin-bottom:6px}

/* ─── Compare CTA in detail ─────────────────────────────── */

.cmp-cta-text{flex:1}

.cmp-cta-sub{font-size:11px;color:rgba(255,255,255,.6);margin-top:1px}
.cmp-cta-arr{color:rgba(255,255,255,.4);font-size:18px}

/* ─── Utils ──────────────────────────────────────────────── */
.divider{height:8px;background:var(--line2);margin:20px 0 0}
.pb-12{padding-bottom:12px}
</style>
</head>

<script>
// ══════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════
</script>
<script src="data.js"></script>
<script>
// ══════════════════════════════════════════════════════
//  Constants
// ══════════════════════════════════════════════════════
const CONCERNS = [
  { key:'all',          label:'전체', emoji:'🐾' },
  { key:'healthy',      label:'건강한 아이', emoji:'😊' },
  { key:'picky_eater',  label:'입맛이 까다로워요', emoji:'🍽' },
  { key:'weight',       label:'체중 관리', emoji:'⚖️' },
  { key:'eye_tear',     label:'눈물·피부', emoji:'👁' },
  { key:'allergy',      label:'알러지', emoji:'🌿' },
  { key:'digestive',    label:'소화가 약해요', emoji:'🫀' },
  { key:'post_surgery', label:'수술·질환 후', emoji:'🩺' },
  { key:'joint',        label:'관절', emoji:'🦴' },
];

const TYPE_LABEL = { dry:'건식', wet:'습식', air_dried:'에어드라이', freeze_dried:'동결건조', raw:'생식' };
const AGE_LABEL  = { puppy:'퍼피', adult:'성견', senior:'시니어', all:'전연령' };
const SIZE_LABEL = { small:'소형', medium:'중형', large:'대형', all:'전체' };
const SHOP_LABEL = { coupang:'쿠팡', brand_official:'브랜드몰', naver:'네이버', gmarket:'지마켓' };

const BRAND_EMOJI = {
  'orijen':'🦁','ziwipeak':'🥩','acana':'🐟','royal-canin':'👑','harim':'🐔',
};
function brandEmoji(slug) { return BRAND_EMOJI[slug] || '🐾' }

const SCORE_LABEL = { quality:'원료', carb:'탄수', additive:'첨가물', value:'가성비' };
const SCORE_COMMENT = {
  quality:{ 5:'동물성만 사용', 4:'대부분 동물성', 3:'보통 수준', 2:'곡물 위주', 1:'출처 불명' },
  carb:   { 5:'20% 미만', 4:'20~30%', 3:'30~40%', 2:'40~50%', 1:'50% 이상' },
  additive:{ 5:'주의성분 없음', 4:'거의 없음', 3:'논쟁 성분', 2:'위험 1개', 1:'위험 다수' },
  value:  { 5:'매우 저렴', 4:'가성비 좋음', 3:'보통', 2:'비싼 편', 1:'프리미엄' },
};

// ══════════════════════════════════════════════════════
//  Navigation
// ══════════════════════════════════════════════════════
let screenHistory = [];
let activeScreen = 'home';

function goNav(id, btn) {
  if (id === activeScreen && !['detail','picker'].includes(id)) return;
  // close overlay screens
  document.getElementById('detail').classList.remove('active');
  document.getElementById('picker').classList.remove('active');
  screenHistory = [];

  document.querySelectorAll('.screen').forEach(s => {
    if (!s.classList.contains('slide-up')) s.classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
  document.getElementById(id).scrollTop = 0;
  activeScreen = id;

  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  document.getElementById('nav').style.display = '';
}

function showScreen(id) {
  screenHistory.push(activeScreen);
  const el = document.getElementById(id);
  el.classList.add('active');
  activeScreen = id;
  if (el.classList.contains('slide-up')) {
    document.getElementById('nav').style.display = 'none';
  }
  el.scrollTop = 0;
}

function goBack() {
  const prev = screenHistory.pop() || 'home';
  const el = document.getElementById(activeScreen);
  el.classList.remove('active');
  activeScreen = prev;
  document.getElementById('nav').style.display = '';
  // re-activate correct nav button
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('on', b.id === 'nav-' + prev);
  });
}

// ══════════════════════════════════════════════════════
//  Utils
// ══════════════════════════════════════════════════════
function sc(s) { return s >= 8 ? 'good' : s >= 6 ? 'warn' : 'bad' }
function scoreColor(s) { return s >= 8 ? 'var(--good)' : s >= 6 ? 'var(--warn)' : 'var(--bad)' }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function won(n) { return Math.round(n).toLocaleString('ko-KR') }
function wg(g) { return g >= 1000 ? (g/1000) + 'kg' : g + 'g' }

function scoreSVG(score, size=76, stroke=7) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const dash = circ * (score / 10);
  const color = scoreColor(score);
  return `<svg viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
      style="transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)"/>
  </svg>`;
}

function miniScoreSVG(score) {
  const r = 14; const stroke = 3.5;
  const circ = 2 * Math.PI * r;
  const dash = circ * (score / 10);
  const color = scoreColor(score);
  return `<svg viewBox="0 0 36 36" width="36" height="36" style="transform:rotate(-90deg)">
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
  </svg>`;
}

// ══════════════════════════════════════════════════════
//  Home
// ══════════════════════════════════════════════════════
let activeConcern = 'all';

function renderConcernChips() {
  document.getElementById('concernChips').innerHTML = CONCERNS.map(c =>
    `<button class="chip${c.key===activeConcern?' on':''}" onclick="selectConcern('${c.key}')">${c.emoji} ${c.label}</button>`
  ).join('');
}

function selectConcern(key) {
  activeConcern = key;
  renderConcernChips();
  renderHome();
}

function hCard(f) {
  const emoji = brandEmoji(f.brandSlug);
  const priceStr = f.price ? `${won(f.price.p)}원 · ${wg(f.price.wg)}` : '';
  return `<div class="hcard" onclick="openDetail('${f.id}')">
    <div class="hcard-thumb">${emoji}</div>
    <div class="hcard-brand">${esc(f.brand)}</div>
    <div class="hcard-name">${esc(f.name)}</div>
    <div class="hcard-score">
      <span class="score-badge ${sc(f.score)}">${f.score}</span>
      <span class="hcard-type">${TYPE_LABEL[f.type]||f.type}</span>
    </div>
    ${priceStr ? `<div style="font-size:10px;color:var(--muted);margin-top:4px;font-weight:600">${priceStr}</div>` : ''}
  </div>`;
}

function renderHScroll(id, list, emptyMsg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = list.length
    ? list.map(hCard).join('')
    : `<div style="padding:16px 20px;font-size:13px;color:var(--muted)">${emptyMsg}</div>`;
}

function renderHome() {
  const sections = document.getElementById('homeSections');
  const filtered = document.getElementById('homeFiltered');

  if (activeConcern === 'all') {
    sections.style.display = '';
    filtered.style.display = 'none';
    filtered.innerHTML = '';

    const rec = FOODS.filter(f => !f.rx).sort((a,b) => b.score - a.score).slice(0, 12);
    document.getElementById('recCount').textContent = `총 ${FOODS.filter(f=>!f.rx).length}개`;
    renderHScroll('rankList', rec, '추천 사료가 없어요');

    const value = [...FOODS].filter(f => !f.rx)
      .sort((a,b) => {
        const va = a.price ? a.price.p / a.price.wg : Infinity;
        const vb = b.price ? b.price.p / b.price.wg : Infinity;
        return va - vb || b.score - a.score;
      }).slice(0, 12);
    renderHScroll('valueList', value, '가성비 사료가 없어요');

    const rx = FOODS.filter(f => f.rx).sort((a,b) => b.score - a.score);
    renderHScroll('rxList', rx, '등록된 처방식이 없어요');
    return;
  }

  sections.style.display = 'none';
  filtered.style.display = '';
  const match = FOODS.filter(f => f.concerns.includes(activeConcern))
    .sort((a,b) => b.score - a.score);
  filtered.innerHTML = match.length
    ? `<div class="sec-hd" style="padding-top:16px"><div class="sec-title">${CONCERNS.find(c=>c.key===activeConcern)?.emoji} 맞는 사료</div><div class="sec-count">${match.length}개</div></div>` +
      `<div style="padding:0 20px;display:flex;flex-direction:column;gap:8px">${match.map(f => fCard(f)).join('')}</div>`
    : `<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <div class="empty-state-title">해당하는 사료가 없어요</div>
        <div class="empty-state-sub">다른 고민을 선택해보세요</div>
      </div>`;
}

// ══════════════════════════════════════════════════════
//  Food Card (vertical)
// ══════════════════════════════════════════════════════
function fCard(f, delay=0) {
  const emoji = brandEmoji(f.brandSlug);
  const warnTag = f.warnCount > 0
    ? `<span class="tag warn">주의성분 ${f.warnCount}</span>`
    : `<span class="tag good">주의성분 없음</span>`;
  const rxTag = f.rx ? `<span class="tag rx">처방식</span>` : '';
  const typeTag = `<span class="tag type">${TYPE_LABEL[f.type]||f.type}</span>`;
  const ageTag = f.ages.map(a => `<span class="tag type" style="background:var(--accent-light);color:var(--accent)">${AGE_LABEL[a]||a}</span>`).join('');
  const priceStr = f.price ? `${won(f.price.p)}원` : '';
  return `<div class="fcard" style="animation-delay:${delay*.04}s" onclick="openDetail('${f.id}')">
    <div class="fcard-thumb">${emoji}</div>
    <div class="fcard-info">
      <div class="fcard-brand">${esc(f.brand)}</div>
      <div class="fcard-name">${esc(f.name)}</div>
      <div class="fcard-tags">${warnTag}${rxTag}${typeTag}${ageTag}</div>
    </div>
    <div class="fcard-right">
      <div class="fcard-score">
        ${miniScoreSVG(f.score)}
        <span class="fcard-score-val" style="color:${scoreColor(f.score)}">${f.score}</span>
      </div>
      ${priceStr ? `<div class="fcard-price">${priceStr}</div>` : ''}
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════
//  Search
// ══════════════════════════════════════════════════════
let activeFilters = { type: null, age: null, size: null };

function buildFilterBar() {
  const types = [...new Set(FOODS.map(f=>f.type))];
  const ages = ['puppy','adult','senior'];
  const sizes = ['small','medium','large'];

  let html = '';
  types.forEach(t => {
    html += `<button class="filter-chip${activeFilters.type===t?' on':''}" onclick="toggleFilter('type','${t}')">${TYPE_LABEL[t]||t}</button>`;
  });
  ages.forEach(a => {
    html += `<button class="filter-chip${activeFilters.age===a?' on':''}" onclick="toggleFilter('age','${a}')">${AGE_LABEL[a]}</button>`;
  });
  sizes.forEach(s => {
    html += `<button class="filter-chip${activeFilters.size===s?' on':''}" onclick="toggleFilter('size','${s}')">${SIZE_LABEL[s]}</button>`;
  });
  document.getElementById('filterBar').innerHTML = html;
}

function toggleFilter(key, val) {
  activeFilters[key] = activeFilters[key] === val ? null : val;
  buildFilterBar();
  onSearchInput();
}

function onSearchInput() {
  const q = (document.getElementById('searchInput').value || '').trim();
  let res = FOODS.filter(f => {
    if (q && !(f.brand + f.name).includes(q)) return false;
    if (activeFilters.type && f.type !== activeFilters.type) return false;
    if (activeFilters.age && !f.ages.includes(activeFilters.age) && !f.ages.includes('all')) return false;
    if (activeFilters.size && !f.sizes.includes(activeFilters.size) && !f.sizes.includes('all')) return false;
    return true;
  }).sort((a,b) => b.score - a.score);

  const container = document.getElementById('searchResults');
  if (!q && !activeFilters.type && !activeFilters.age && !activeFilters.size) {
    container.innerHTML = `<div class="empty-state" style="padding-top:40px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <div class="empty-state-title">사료를 검색해보세요</div>
      <div class="empty-state-sub">브랜드명, 제품명으로 검색</div>
    </div>`;
    return;
  }
  if (!res.length) {
    container.innerHTML = `<div class="empty-state" style="padding-top:40px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <div class="empty-state-title">검색 결과가 없어요</div>
      <div class="empty-state-sub">다른 키워드나 필터를 시도해보세요</div>
    </div>`;
    return;
  }
  container.innerHTML = res.map((f,i) => fCard(f,i)).join('');
}

  let nutrHtml = '';

      { lbl:'탄수화물(추정)', val:n.carb, unit:'%', max:60, note:'25% 이하 좋음', barColor:n.carb<=25?'var(--good)':n.carb<=40?'var(--warn)':'var(--bad)' },
      { lbl:'생육 함량', val:n.meat, unit:'%', max:100, note:'70% 이상 고품질', barColor:n.meat>=70?'var(--good)':n.meat>=40?'var(--warn)':'var(--bad)' },

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      ${d?.recall ? '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' : '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'}

  </div>`;

  // Feeding calculator (tab 2)
  const calPerKg = d?.nutrient?.cal || 3600;

  if (d?.prices?.length) {

      d.prices.map(p => `<div class="price-row">
        <div class="price-info">
          <div class="price-shop">${SHOP_LABEL[p.shop]||p.shop} · ${wg(p.wg)}</div>

          <div class="price-per-kg">100g당 ${won(p.pKg/10)}원</div>

          ? `<button class="price-btn-buy" onclick="event.stopPropagation();window.open('${p.url}','_blank','noopener')">구매</button>`
          : `<button class="price-btn-none" disabled>링크 없음</button>`}
      </div>`).join('') +
      '</div><div class="price-note" style="margin-top:6px;padding:0 2px">제휴 수수료를 받을 수 있지만 점수에는 영향 없어요.</div></div>';
  }

  document.getElementById('detailBody').innerHTML = `
    <div class="detail-hero">
      <div class="detail-thumb">${emoji}</div>
      <div class="detail-meta">
        <div class="detail-brand">${esc(f.brand)}${countryBadge ? ` · ${d.country}` : ''}</div>
        <div class="detail-name">${esc(f.name)}</div>
        <div class="detail-badges">${warnBadge}${rxBadge}${ageBadges}${sizeBadge}</div>

      <div class="score-circle">

        <div class="score-circle-val">
          <div class="score-circle-num" style="color:${scoreColor(f.score)}">${f.score}</div>

      <div class="score-info">

    <div class="dtab-bar">

      <div class="dtab" id="dtab-feed" onclick="switchDtab('feed')">급여량 · 가격</div>
    </div>

    <div class="dtab-panel on" id="dpanel-analysis">
      ${verdictHtml}
      ${fitHtml}
      <div class="divider"></div>
      ${ingrHtml}
      <div class="divider"></div>
      ${nutrHtml}
      ${recallHtml}
      <div class="disclaimer">분석 기준 — 라벨 표기 성분 기준 추정치예요. 소화율·생체이용률은 포함되지 않아요. 건강 문제는 반드시 수의사와 상담하세요.</div>
    </div>

    <div class="dtab-panel" id="dpanel-feed">
      <div class="calc-card" style="margin-top:16px">
        <div class="calc-title">🍽 하루에 얼마나 줄까요?</div>
        <div class="calc-sub">몸무게와 끼니 수를 입력해주세요</div>

        <div class="calc-field">
          <div class="calc-field-lbl">우리 아이 몸무게</div>
          <div class="weight-row">
            <input type="number" id="weightInput" class="weight-num-input" min="0.5" max="80" step="0.5" value="5">
            <span class="weight-unit">kg</span>
          </div>
          <input type="range" id="weightSlider" class="weight-slider" min="1" max="50" step="0.5" value="5">
        </div>

        <div class="calc-field">
          <div class="calc-field-lbl">하루 끼니 수</div>
          <div class="meal-btns" id="mealBtns"></div>
        </div>

        <div class="calc-hl" id="calcHL">
          <div class="calc-hl-cell"><div class="calc-hl-lbl">하루 권장량</div><div class="calc-hl-val">—</div></div>
          <div class="calc-hl-divider"></div>
          <div class="calc-hl-cell"><div class="calc-hl-lbl">1회 권장량</div><div class="calc-hl-val">—</div></div>
        </div>

        <div class="calc-field">
          <div class="calc-field-lbl">봉지 용량</div>
          <div class="bag-btns" id="bagBtns"></div>
          <div class="bag-custom-row">
            <span class="bag-custom-lbl">직접 입력</span>
            <input type="number" id="bagCustom" class="bag-custom-input" min="0.1" step="0.1" placeholder="예: 6">
            <span class="weight-unit">kg</span>
          </div>
          <div class="bag-days" id="bagDays"></div>
        </div>

        <div class="calc-hint">성견 유지 기준(RER×1.6) 계산값이에요. 활동량·나이에 따라 달라질 수 있어요.</div>
      </div>

      ${priceHtml}

      <div class="cmp-cta" onclick="addToCmp()">
        <div class="cmp-cta-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="18" rx="1"/><rect x="13" y="3" width="8" height="18" rx="1"/></svg>
        </div>
        <div class="cmp-cta-text">
          <div class="cmp-cta-main">다른 사료와 비교하기</div>
          <div class="cmp-cta-sub">성분을 나란히 놓고 비교해드려요</div>
        </div>
        <div class="cmp-cta-arr">›</div>
      </div>

      <div style="height:20px"></div>
    </div>
  `;

  // Init feeding calculator
  let curWeight = 5, curMeals = 2, curBagG = weightOpts[0] || 2000;

  function calcFeeding() {
    const w = curWeight > 0 ? curWeight : 0;
    const rer = 70 * Math.pow(w, 0.75);
    const dailyG = w > 0 ? Math.round(rer * 1.6 / calPerKg * 1000) : 0;
    const mealG = curMeals > 0 ? Math.round(dailyG / curMeals) : dailyG;
    document.getElementById('calcHL').innerHTML = `
      <div class="calc-hl-cell">
        <div class="calc-hl-lbl">하루 권장량</div>
        <div class="calc-hl-val">${dailyG}<span>g</span></div>
      </div>
      <div class="calc-hl-divider"></div>
      <div class="calc-hl-cell">
        <div class="calc-hl-lbl">1회 (${curMeals}끼)</div>
        <div class="calc-hl-val">${mealG}<span>g</span></div>
      </div>`;
    const days = dailyG > 0 ? Math.floor(curBagG / dailyG) : 0;
    document.getElementById('bagDays').innerHTML = `${wg(curBagG)} 한 봉지 기준 약 <strong>${days}일</strong>`;
  }

  function renderMealBtns() {
    document.getElementById('mealBtns').innerHTML = [1,2,3,4].map(m =>
      `<button class="meal-btn${m===curMeals?' on':''}" onclick="(function(){curMeals=${m};renderMealBtns();calcFeeding()})()">${m}끼</button>`
    ).join('');
  }

  function renderBagBtns() {
    document.getElementById('bagBtns').innerHTML = weightOpts.map(g =>
      `<button class="bag-btn${g===curBagG?' on':''}" onclick="(function(){curBagG=${g};document.getElementById('bagCustom').value='';renderBagBtns();calcFeeding()})()">${wg(g)}</button>`
    ).join('');
  }

  // Expose inner functions via closure-wrapped globals for event handlers
  window.__calcState = { get curMeals(){return curMeals}, set curMeals(v){curMeals=v}, get curBagG(){return curBagG}, set curBagG(v){curBagG=v}, renderMealBtns, renderBagBtns, calcFeeding };

  const wIn = document.getElementById('weightInput');
  const wSl = document.getElementById('weightSlider');
  if (wIn) wIn.oninput = () => { curWeight = parseFloat(wIn.value)||0; if(curWeight>=1&&curWeight<=50) wSl.value=curWeight; calcFeeding(); };
  if (wSl) wSl.oninput = () => { curWeight = parseFloat(wSl.value); wIn.value = curWeight; calcFeeding(); };
  const bagCI = document.getElementById('bagCustom');
  if (bagCI) bagCI.oninput = () => { const v = parseFloat(bagCI.value); if(v>0){curBagG=Math.round(v*1000);renderBagBtns();calcFeeding();} };

  renderMealBtns();
  renderBagBtns();
  calcFeeding();

  showScreen('detail');
}

function switchDtab(tab) {
  ['analysis','feed'].forEach(t => {
    document.getElementById('dtab-'+t)?.classList.toggle('on', t===tab);
    document.getElementById('dpanel-'+t)?.classList.toggle('on', t===tab);
  });
  document.getElementById('detail').scrollTop = 0;
}

let cmpA = null, cmpB = null, pickTarget = 'A';

function addToCmp() {
  const f = FOODS.find(x => x.id === curDetailId);
  if (!f) return;
  if (!cmpA) cmpA = f;
  else if (!cmpB) cmpB = f;
  else { cmpA = cmpB; cmpB = f; }
  renderSlots();
  goNav('compare', document.getElementById('nav-compare'));
}

function openPicker(target) {
  pickTarget = target;
  document.getElementById('pickerSearch').value = '';
  filterPicker();
  showScreen('picker');
}

function filterPicker() {
  const q = (document.getElementById('pickerSearch')?.value||'').trim();
  const list = FOODS.filter(f => !q || (f.brand+f.name).includes(q));
  document.getElementById('pickerList').innerHTML = list.map(f =>
    `<div class="fcard" onclick="pickFood('${f.id}')">
      <div class="fcard-thumb">${brandEmoji(f.brandSlug)}</div>
      <div class="fcard-info">
        <div class="fcard-brand">${esc(f.brand)}</div>
        <div class="fcard-name">${esc(f.name)}</div>
        <div class="fcard-tags"><span class="tag ${sc(f.score)==='good'?'good':sc(f.score)==='warn'?'warn':'bad'}">점수 ${f.score}</span><span class="tag type">${TYPE_LABEL[f.type]||f.type}</span></div>
      </div>
      <div class="fcard-right">
        <div class="fcard-score">${miniScoreSVG(f.score)}<span class="fcard-score-val" style="color:${scoreColor(f.score)}">${f.score}</span></div>
      </div>
    </div>`
  ).join('');
}

function pickFood(id) {
  const f = FOODS.find(x => x.id === id);
  if (!f) return;
  if (pickTarget === 'A') cmpA = f; else cmpB = f;
  renderSlots();
  goBack();
}

function renderSlots() {
  function slotHtml(id, f, label) {
    if (!f) return `<div class="cmp-slot" id="slot${id}" onclick="openPicker('${id}')">
      <div class="cmp-slot-plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="cmp-slot-empty-lbl">${label} 선택</div>
    </div>`;
    return `<div class="cmp-slot filled" id="slot${id}" onclick="openPicker('${id}')">
      <div class="cmp-slot-brand">${esc(f.brand)}</div>
      <div class="cmp-slot-name">${esc(f.name)}</div>
      <div class="cmp-slot-score" style="color:${scoreColor(f.score)}">${f.score}</div>
    </div>`;
  }
  document.getElementById('slotA').outerHTML = slotHtml('A', cmpA, '사료 A');
  document.getElementById('slotB').outerHTML = slotHtml('B', cmpB, '사료 B');
  document.getElementById('cmpBtn').disabled = !(cmpA && cmpB);
  if (cmpA && cmpB) runCompare();
}

function runCompare() {
  if (!cmpA || !cmpB) return;
  const da = DETAIL[cmpA.id];
  const db = DETAIL[cmpB.id];

  function highlight(va, vb, higherBetter=true) {
    if (va == null || vb == null) return ['',''];
    return higherBetter
      ? [va > vb ? 'highlight' : '', vb > va ? 'highlight' : '']
      : [va < vb ? 'highlight' : '', vb < va ? 'highlight' : ''];
  }

  const rows = [
    { lbl:'총점', va: cmpA.score, vb: cmpB.score, fmt: v => v+' / 10', hi: true },
    { lbl:'원료', va: cmpA.ratings.quality, vb: cmpB.ratings.quality, fmt: v => '★'.repeat(v)+'☆'.repeat(5-v), hi: true },
    { lbl:'탄수화물', va: cmpA.ratings.carb, vb: cmpB.ratings.carb, fmt: v => '★'.repeat(v)+'☆'.repeat(5-v), hi: true },
    { lbl:'첨가물', va: cmpA.ratings.additive, vb: cmpB.ratings.additive, fmt: v => '★'.repeat(v)+'☆'.repeat(5-v), hi: true },
    { lbl:'가성비', va: cmpA.ratings.value, vb: cmpB.ratings.value, fmt: v => '★'.repeat(v)+'☆'.repeat(5-v), hi: true },
    { lbl:'단백질', va: da?.nutrient?.protein, vb: db?.nutrient?.protein, fmt: v => v != null ? v+'%' : '-', hi: true },
    { lbl:'탄수(추정)', va: da?.nutrient?.carb, vb: db?.nutrient?.carb, fmt: v => v != null ? v+'%' : '-', hi: false },
    { lbl:'지방', va: da?.nutrient?.fat, vb: db?.nutrient?.fat, fmt: v => v != null ? v+'%' : '-', hi: false },
    { lbl:'생육 함량', va: da?.nutrient?.meat, vb: db?.nutrient?.meat, fmt: v => v != null ? v+'%' : '-', hi: true },
    { lbl:'가격(최저)', va: cmpA.price?.p, vb: cmpB.price?.p, fmt: v => v != null ? won(v)+'원' : '-', hi: false },
    { lbl:'타입', va: TYPE_LABEL[cmpA.type]||cmpA.type, vb: TYPE_LABEL[cmpB.type]||cmpB.type, fmt: v => v, hi: null },
    { lbl:'연령대', va: cmpA.ages.map(a=>AGE_LABEL[a]||a).join('·'), vb: cmpB.ages.map(a=>AGE_LABEL[a]||a).join('·'), fmt: v=>v, hi: null },
    { lbl:'주의성분', va: cmpA.warnCount, vb: cmpB.warnCount, fmt: v => v+'개', hi: false },
  ];

  const tableRows = rows.map(r => {
    const [ha, hb] = r.hi != null ? highlight(r.va, r.vb, r.hi) : ['',''];
    return `<div class="cmp-table-row">
      <div class="cmp-table-label">${r.lbl}</div>
      <div class="cmp-table-val ${ha}">${r.fmt(r.va)}</div>
      <div class="cmp-table-val ${hb}">${r.fmt(r.vb)}</div>
    </div>`;
  }).join('');

  document.getElementById('cmpTableWrap').innerHTML = `
    <div class="cmp-table-wrap" style="margin-top:12px">
      <div class="cmp-table-hd">
        <div></div>
        <div>${esc(cmpA.name.length>10?cmpA.name.slice(0,10)+'…':cmpA.name)}</div>
        <div>${esc(cmpB.name.length>10?cmpB.name.slice(0,10)+'…':cmpB.name)}</div>
      </div>
      ${tableRows}
    </div>
    <div style="height:20px"></div>`;
}

// ══════════════════════════════════════════════════════

renderConcernChips();
renderHome();
buildFilterBar();
onSearchInput();
</script>
